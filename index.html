<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes it mobile-friendly — scales to phone screen width -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <!-- PWA stuff — theme color for browser chrome, manifest for install -->
  <meta name="theme-color" content="#16213e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tech Portal">
  <link rel="manifest" href="manifest.json">
  <!-- Tesseract.js for OCR — runs entirely in the browser, no server needed -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <title>Tech Portal</title>

  <style>
    /* ========================================
       BASE STYLES — Dark theme, mobile-first
       ======================================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      /* Prevent iOS bounce/overscroll */
      overscroll-behavior: none;
    }

    /* ========================================
       HEADER
       ======================================== */
    .header {
      background: #16213e;
      padding: 16px 20px;
      text-align: center;
      border-bottom: 2px solid #0f3460;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header h1 {
      font-size: 20px;
      color: #e94560;
      letter-spacing: 1px;
    }

    /* ========================================
       TAB NAVIGATION — Lookup / Notes / History
       ======================================== */
    .tab-bar {
      display: flex;
      background: #16213e;
      border-bottom: 2px solid #0f3460;
      position: sticky;
      top: 54px;  /* below header */
      z-index: 99;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      color: #8a8a9a;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }

    .tab-btn.active {
      color: #e94560;
      border-bottom-color: #e94560;
    }

    /* Tab content panels — only show the active one */
    .tab-content {
      display: none;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    .tab-content.active {
      display: block;
    }

    /* ========================================
       FORM ELEMENTS — Inputs, selects, buttons
       ======================================== */
    label {
      display: block;
      font-size: 12px;
      color: #8a8a9a;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      margin-top: 16px;
    }

    label:first-child {
      margin-top: 0;
    }

    input[type="text"],
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      background: #0f3460;
      border: 1px solid #1a4a7a;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 16px; /* 16px prevents iOS zoom on focus */
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    select:focus,
    textarea:focus {
      border-color: #e94560;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    /* Primary action button */
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 20px;
      letter-spacing: 0.5px;
      transition: background 0.2s;
    }

    .btn-primary:active {
      background: #c73650;
    }

    /* Secondary / outline button */
    .btn-secondary {
      width: 100%;
      padding: 12px;
      background: transparent;
      color: #e94560;
      border: 2px solid #e94560;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s;
    }

    .btn-secondary:active {
      background: #e94560;
      color: white;
    }

    /* Small inline button */
    .btn-small {
      padding: 8px 16px;
      background: #0f3460;
      color: #e0e0e0;
      border: 1px solid #1a4a7a;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      margin-top: 6px;
      margin-right: 6px;
    }

    .btn-small:active {
      background: #1a4a7a;
    }

    /* ========================================
       BRAND QUICK-PICK CHIPS
       ======================================== */
    .brand-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .brand-chip {
      padding: 8px 14px;
      background: #0f3460;
      border: 1px solid #1a4a7a;
      border-radius: 20px;
      color: #c0c0d0;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .brand-chip.selected {
      background: #e94560;
      border-color: #e94560;
      color: white;
    }

    /* ========================================
       SEARCH RESULTS — Link list
       ======================================== */
    .results-section {
      margin-top: 20px;
      display: none;
    }

    .results-section.visible {
      display: block;
    }

    .result-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px;
      background: #0f3460;
      border-radius: 8px;
      margin-bottom: 8px;
      text-decoration: none;
      color: #e0e0e0;
      border: 1px solid #1a4a7a;
      transition: border-color 0.2s;
    }

    .result-link:active {
      border-color: #e94560;
    }

    .result-link .site-name {
      font-weight: 600;
      font-size: 15px;
    }

    .result-link .site-note {
      font-size: 12px;
      color: #8a8a9a;
    }

    .result-link .arrow {
      color: #e94560;
      font-size: 18px;
    }

    /* ========================================
       NOTES SECTION
       ======================================== */
    .note-preview {
      background: #0f3460;
      border: 1px solid #1a4a7a;
      border-radius: 8px;
      padding: 16px;
      margin-top: 16px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
      color: #c0c0d0;
      min-height: 120px;
    }

    /* Toast notification for "Copied!" feedback */
    .toast {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #4caf50;
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ========================================
       HISTORY SECTION
       ======================================== */
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: #0f3460;
      border: 1px solid #1a4a7a;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .history-item:active {
      border-color: #e94560;
    }

    .history-model {
      font-weight: 600;
      font-size: 15px;
    }

    .history-brand {
      font-size: 12px;
      color: #8a8a9a;
    }

    .history-date {
      font-size: 12px;
      color: #8a8a9a;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #8a8a9a;
    }

    /* ========================================
       NOTE TYPE TOGGLE (Service Call vs Install)
       ======================================== */
    .toggle-group {
      display: flex;
      gap: 0;
      margin-top: 8px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #1a4a7a;
    }

    .toggle-btn {
      flex: 1;
      padding: 10px;
      background: #0f3460;
      border: none;
      color: #8a8a9a;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: #e94560;
      color: white;
    }

    /* Bullet point rows */
    .bullet-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .bullet-row span {
      color: #e94560;
      font-weight: bold;
    }

    .bullet-row input {
      flex: 1;
    }

    .remove-bullet {
      background: none;
      border: none;
      color: #8a8a9a;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
    }

    /* ========================================
       SAVED NOTES LIST
       ======================================== */
    .saved-note-item {
      padding: 12px 14px;
      background: #0f3460;
      border: 1px solid #1a4a7a;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .saved-note-item:active {
      border-color: #e94560;
    }

    .saved-note-title {
      font-weight: 600;
      font-size: 15px;
    }

    .saved-note-meta {
      font-size: 12px;
      color: #8a8a9a;
      margin-top: 4px;
    }

    .section-divider {
      border: none;
      border-top: 1px solid #1a4a7a;
      margin: 20px 0;
    }

    /* ========================================
       OCR / CAMERA FEATURE
       ======================================== */
    .input-with-camera {
      display: flex;
      gap: 8px;
    }

    .input-with-camera input {
      flex: 1;
    }

    .camera-btn {
      width: 48px;
      height: 48px;
      background: #e94560;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 22px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .camera-btn:active {
      background: #c73650;
    }

    /* Hidden file input for camera */
    #cameraInput {
      display: none;
    }

    /* OCR processing overlay */
    .ocr-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 200;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .ocr-overlay.visible {
      display: flex;
    }

    .ocr-status {
      color: #e94560;
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .ocr-progress {
      width: 200px;
      height: 6px;
      background: #0f3460;
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .ocr-progress-bar {
      height: 100%;
      background: #e94560;
      width: 0%;
      transition: width 0.3s;
    }

    .ocr-preview {
      max-width: 300px;
      max-height: 200px;
      border-radius: 8px;
      margin-bottom: 20px;
      object-fit: contain;
    }

    /* OCR results — list of detected text strings to pick from */
    .ocr-results {
      width: 100%;
      max-width: 400px;
      max-height: 50vh;
      overflow-y: auto;
    }

    .ocr-results label {
      color: #e94560;
      margin-bottom: 8px;
    }

    .ocr-result-item {
      padding: 12px 14px;
      background: #0f3460;
      border: 1px solid #1a4a7a;
      border-radius: 8px;
      margin-bottom: 6px;
      color: #e0e0e0;
      font-family: monospace;
      font-size: 15px;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .ocr-result-item:active {
      border-color: #e94560;
      background: #1a4a7a;
    }

    .ocr-result-item .ocr-tag {
      font-family: -apple-system, sans-serif;
      font-size: 11px;
      color: #8a8a9a;
      display: block;
      margin-top: 4px;
    }

    .ocr-close-btn {
      margin-top: 16px;
      padding: 12px 32px;
      background: transparent;
      color: #8a8a9a;
      border: 1px solid #8a8a9a;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- ==================== HEADER ==================== -->
  <div class="header">
    <h1>TECH PORTAL</h1>
  </div>

  <!-- ==================== TAB BAR ==================== -->
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="lookup">Lookup</button>
    <button class="tab-btn" data-tab="notes">Notes</button>
    <button class="tab-btn" data-tab="parts">Parts</button>
    <button class="tab-btn" data-tab="history">History</button>
  </div>

  <!-- ==================== LOOKUP TAB ==================== -->
  <div id="lookup" class="tab-content active">
    <label for="modelInput">Model Number</label>
    <div class="input-with-camera">
      <input type="text" id="modelInput" placeholder="e.g. KFGC506JSS05"
             autocapitalize="characters" autocomplete="off" spellcheck="false">
      <!-- Camera button — opens phone camera for OCR -->
      <button class="camera-btn" id="cameraBtn" title="Scan model tag">&#128247;</button>
    </div>
    <!-- Hidden file input that triggers the camera -->
    <input type="file" id="cameraInput" accept="image/*" capture="environment">

    <label>Brand</label>
    <!-- Auto-detected brand shows here, or pick manually -->
    <div class="brand-chips" id="brandChips">
      <div class="brand-chip" data-brand="whirlpool">Whirlpool</div>
      <div class="brand-chip" data-brand="maytag">Maytag</div>
      <div class="brand-chip" data-brand="kitchenaid">KitchenAid</div>
      <div class="brand-chip" data-brand="amana">Amana</div>
      <div class="brand-chip" data-brand="samsung">Samsung</div>
      <div class="brand-chip" data-brand="lg">LG</div>
      <div class="brand-chip" data-brand="frigidaire">Frigidaire</div>
      <div class="brand-chip" data-brand="electrolux">Electrolux</div>
      <div class="brand-chip" data-brand="ge">GE</div>
      <div class="brand-chip" data-brand="bosch">Bosch</div>
      <div class="brand-chip" data-brand="thermador">Thermador</div>
      <div class="brand-chip" data-brand="viking">Viking</div>
    </div>

    <button class="btn-primary" id="searchBtn">Search Parts Sites</button>

    <!-- Search results appear here -->
    <div class="results-section" id="resultsSection">
      <label>Open Sites</label>
      <div id="resultLinks"></div>
      <button class="btn-secondary" id="openAllBtn">Open All Links</button>
    </div>
  </div>

  <!-- ==================== NOTES TAB ==================== -->
  <div id="notes" class="tab-content">
    <label for="noteTitle">Job Title</label>
    <input type="text" id="noteTitle" placeholder="e.g. Refrigerator not cooling">

    <label for="noteModel">Model Number</label>
    <input type="text" id="noteModel" placeholder="Auto-fills from Lookup tab"
           autocapitalize="characters" autocomplete="off" spellcheck="false">

    <label for="noteSerial">Serial Number</label>
    <input type="text" id="noteSerial" placeholder="Enter serial number"
           autocapitalize="characters" autocomplete="off" spellcheck="false">

    <label>Note Type</label>
    <div class="toggle-group">
      <button class="toggle-btn active" data-type="service">Service Call</button>
      <button class="toggle-btn" data-type="install">Install Labor</button>
    </div>

    <label>Notes</label>
    <div id="bulletContainer">
      <!-- Bullet point rows get added here -->
    </div>
    <button class="btn-small" id="addBulletBtn">+ Add bullet</button>

    <label>Preview</label>
    <div class="note-preview" id="notePreview"></div>

    <button class="btn-primary" id="copyNoteBtn">Copy to Clipboard</button>
    <button class="btn-secondary" id="saveNoteBtn">Save Note</button>
    <button class="btn-secondary" id="clearNoteBtn">Clear</button>

    <hr class="section-divider">
    <label>Saved Notes</label>
    <div id="savedNotesList"></div>
  </div>

  <!-- ==================== PARTS TAB ==================== -->
  <div id="parts" class="tab-content">
    <label for="partCustomer">Customer Name</label>
    <input type="text" id="partCustomer" placeholder="e.g. Smith, John">

    <label for="partInvoice">Invoice #</label>
    <input type="text" id="partInvoice" placeholder="e.g. 12345"
           autocomplete="off" spellcheck="false">

    <label for="partNumber">Part Number</label>
    <input type="text" id="partNumber" placeholder="e.g. W11396618"
           autocapitalize="characters" autocomplete="off" spellcheck="false">

    <label for="partDesc">Part Description</label>
    <input type="text" id="partDesc" placeholder="e.g. Control Board, Thermal Fuse">

    <label>Status</label>
    <div class="toggle-group">
      <button class="toggle-btn active" data-status="aa">Aa (Awaiting Approval)</button>
      <button class="toggle-btn" data-status="date">Approved (Date)</button>
    </div>
    <!-- Date picker, shown only when "Approved" is selected -->
    <div id="partDateRow" style="display:none; margin-top:8px;">
      <input type="date" id="partDate" style="width:100%; padding:12px 14px; background:#0f3460;
        border:1px solid #1a4a7a; border-radius:8px; color:#e0e0e0; font-size:16px;">
    </div>

    <!-- Warranty toggle — highlights row yellow in the sheet -->
    <label style="margin-top:16px; display:flex; align-items:center; gap:10px; cursor:pointer;
      text-transform:none; font-size:14px; color:#e0e0e0; letter-spacing:0;">
      <input type="checkbox" id="partWarranty" style="width:20px; height:20px; accent-color:#e94560;">
      Warranty (highlight row yellow)
    </label>

    <label>Preview (Column C format)</label>
    <div class="note-preview" id="partPreview" style="min-height:40px;"></div>

    <button class="btn-primary" id="sendToSheetBtn">Send to Google Sheet</button>
    <button class="btn-secondary" id="addAnotherPartBtn">+ Add Another Part (Same Customer)</button>
    <button class="btn-secondary" id="clearPartsBtn">Clear</button>
    <button class="btn-small" id="resetSheetUrlBtn" style="margin-top:16px;">
      Change Sheet URL
    </button>
    <button class="btn-small" id="testSheetBtn" style="margin-top:8px;">
      Test Sheet Connection
    </button>

    <hr class="section-divider">
    <label>Sent Parts Log</label>
    <div id="partsLog"></div>
  </div>

  <!-- ==================== HISTORY TAB ==================== -->
  <div id="history" class="tab-content">
    <label>Recent Lookups</label>
    <div id="historyList"></div>
    <button class="btn-secondary" id="clearHistoryBtn" style="margin-top:16px">Clear History</button>
  </div>

  <!-- OCR Processing Overlay -->
  <div class="ocr-overlay" id="ocrOverlay">
    <img class="ocr-preview" id="ocrPreview" alt="Captured image">
    <div class="ocr-status" id="ocrStatus">Reading tag...</div>
    <div class="ocr-progress">
      <div class="ocr-progress-bar" id="ocrProgressBar"></div>
    </div>
    <div class="ocr-results" id="ocrResults"></div>
    <button class="ocr-close-btn" id="ocrCloseBtn">Cancel</button>
  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast">Copied!</div>

  <script>
    // ============================================================
    // CONFIGURATION — Edit these URLs if site patterns change
    // ============================================================

    // Each brand maps to a list of sites to search.
    // {model} gets replaced with the actual model number.
    // "always" sites show for every brand, brand-specific sites add on top.

    const SITES = {
      // These show for EVERY brand
      always: [
        {
          name: 'Marcone',
          // Deep-link into Marcone search results for this model number
          url: 'https://beta.marcone.com/Home/RunSearchPartModelList?searchString={model}&type=Part',
          note: 'Pricing & availability'
        },
        {
          name: 'Sears Parts Direct',
          url: 'https://www.searspartsdirect.com/search?q={model}',
          note: 'Parts breakdown'
        },
        {
          name: 'Reliable Parts',
          // Opens Reliable Parts search results
          url: 'https://www.reliableparts.com/catalogsearch/result/?q={model}#models',
          note: 'Parts lookup'
        }
      ],

      // Brand-specific sites — these get ADDED to the "always" list
      bosch: [
        {
          name: 'Bosch Parts',
          url: 'https://www.bosch-home.com/us/owner-support/cleaners-accessories/spare-parts-test',
          note: 'Manufacturer parts lookup'
        }
      ],
      thermador: [
        {
          name: 'Thermador Parts',
          url: 'https://www.thermador.com/us/support/spareparts',
          note: 'Manufacturer parts lookup'
        }
      ],
      viking: [
        {
          name: 'All Viking Parts',
          url: 'https://www.allvikingparts.com/',
          note: 'Part numbers'
        }
      ],
      ge: [
        {
          name: 'GE Parts',
          url: 'https://www.geapplianceparts.com/store/parts/search/model/{model}',
          note: 'Manufacturer parts lookup'
        }
      ]
    };

    // ============================================================
    // BRAND AUTO-DETECTION
    // Model number prefixes mapped to brands.
    // These are common patterns — not exhaustive. Manual override
    // is always available via the chips.
    // ============================================================

    const BRAND_PATTERNS = [
      // KitchenAid — starts with K (ranges, dishwashers, fridges)
      { prefix: /^K/i, brand: 'kitchenaid' },
      // Whirlpool — starts with W
      { prefix: /^W/i, brand: 'whirlpool' },
      // Maytag — starts with M
      { prefix: /^M/i, brand: 'maytag' },
      // Amana — starts with A (but be careful, not all A-models are Amana)
      { prefix: /^A/i, brand: 'amana' },
      // Samsung — common prefixes
      { prefix: /^(RF|WF|DW|NE|NX|RS|RT|ME|MC|RB|RH|WA|DV|WV)/i, brand: 'samsung' },
      // LG — common prefixes
      { prefix: /^(LR|WM|LD|LDF|LSE|LDE|LT|LW|DL|LRMVS|LRFXS|LFXS)/i, brand: 'lg' },
      // Frigidaire — starts with FF, FG, FRT
      { prefix: /^(FF|FG|FRT|FGHB|FFSS|FGHS)/i, brand: 'frigidaire' },
      // Electrolux — starts with EI, EW, EFLS
      { prefix: /^(EI|EW|EFLS|ELF)/i, brand: 'electrolux' },
      // GE — common prefixes (lots of variation)
      { prefix: /^(GS|GT|JB|GFW|GDT|PFE|PSE|JGB|GNE|PYE|GDF|PDP|PDT)/i, brand: 'ge' },
      // Bosch — starts with SH (dishwashers), B, HBL, HGI
      { prefix: /^(SH|HBL|HGI|HDI|NGM|NIT|SHPM|SHEM|B[0-9])/i, brand: 'bosch' },
      // Thermador — common prefixes
      { prefix: /^(PRD|PRL|SGS|DWHD|PODS|MED|T[0-9]{2})/i, brand: 'thermador' },
      // Viking — starts with V
      { prefix: /^V/i, brand: 'viking' },
    ];

    // ============================================================
    // APP STATE
    // ============================================================

    let selectedBrand = null;
    let noteType = 'service'; // 'service' or 'install'

    // ============================================================
    // TAB SWITCHING
    // ============================================================

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        // Deactivate all tabs and panels
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        // Activate clicked tab and its panel
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
      });
    });

    // ============================================================
    // BRAND DETECTION & SELECTION
    // ============================================================

    const modelInput = document.getElementById('modelInput');
    const brandChips = document.querySelectorAll('.brand-chip');

    // Auto-detect brand as user types
    modelInput.addEventListener('input', () => {
      const model = modelInput.value.trim().toUpperCase();
      if (model.length < 2) return;

      // Try to match a brand pattern
      for (const pattern of BRAND_PATTERNS) {
        if (pattern.prefix.test(model)) {
          selectBrand(pattern.brand);
          return;
        }
      }
    });

    // Manual brand selection via chips
    brandChips.forEach(chip => {
      chip.addEventListener('click', () => {
        selectBrand(chip.dataset.brand);
      });
    });

    function selectBrand(brand) {
      selectedBrand = brand;
      // Update chip visual state
      brandChips.forEach(c => {
        c.classList.toggle('selected', c.dataset.brand === brand);
      });
    }

    // ============================================================
    // SEARCH — Generate links to parts sites
    // ============================================================

    const searchBtn = document.getElementById('searchBtn');
    const resultsSection = document.getElementById('resultsSection');
    const resultLinks = document.getElementById('resultLinks');
    const openAllBtn = document.getElementById('openAllBtn');

    searchBtn.addEventListener('click', () => {
      const model = modelInput.value.trim();
      if (!model) {
        modelInput.focus();
        return;
      }

      // Build list of sites to show
      let sites = [...SITES.always];

      // Add brand-specific sites if a brand is selected
      if (selectedBrand && SITES[selectedBrand]) {
        sites = [...sites, ...SITES[selectedBrand]];
      }

      // Generate the links
      resultLinks.innerHTML = '';
      const urls = []; // for "Open All"

      sites.forEach(site => {
        const url = site.url.replace('{model}', encodeURIComponent(model));
        urls.push(url);

        const link = document.createElement('a');
        link.href = url;
        link.target = '_blank';
        link.rel = 'noopener';
        link.className = 'result-link';
        link.innerHTML = `
          <div>
            <div class="site-name">${site.name}</div>
            <div class="site-note">${site.note}</div>
          </div>
          <div class="arrow">&rsaquo;</div>
        `;
        resultLinks.appendChild(link);
      });

      resultsSection.classList.add('visible');

      // Also auto-fill the notes tab model field
      document.getElementById('noteModel').value = model;

      // Save to search history
      saveToHistory(model, selectedBrand);

      // Copy model number to clipboard for easy pasting (e.g., into Marcone search)
      copyToClipboard(model);
    });

    // Open all links at once
    openAllBtn.addEventListener('click', () => {
      const links = resultLinks.querySelectorAll('a');
      links.forEach(link => {
        window.open(link.href, '_blank');
      });
    });

    // ============================================================
    // SEARCH HISTORY — Stored in localStorage
    // ============================================================

    function saveToHistory(model, brand) {
      const history = JSON.parse(localStorage.getItem('fb_history') || '[]');
      // Add to front, remove duplicates
      const filtered = history.filter(h => h.model !== model);
      filtered.unshift({
        model: model,
        brand: brand || 'unknown',
        date: new Date().toLocaleDateString()
      });
      // Keep last 50 entries
      localStorage.setItem('fb_history', JSON.stringify(filtered.slice(0, 50)));
      renderHistory();
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem('fb_history') || '[]');
      const list = document.getElementById('historyList');

      if (history.length === 0) {
        list.innerHTML = '<div class="empty-state">No searches yet</div>';
        return;
      }

      list.innerHTML = '';
      history.forEach(item => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `
          <div>
            <div class="history-model">${item.model}</div>
            <div class="history-brand">${item.brand}</div>
          </div>
          <div class="history-date">${item.date}</div>
        `;
        // Clicking a history item loads it into the lookup tab
        div.addEventListener('click', () => {
          modelInput.value = item.model;
          if (item.brand && item.brand !== 'unknown') {
            selectBrand(item.brand);
          }
          // Switch to lookup tab
          document.querySelector('[data-tab="lookup"]').click();
        });
        list.appendChild(div);
      });
    }

    document.getElementById('clearHistoryBtn').addEventListener('click', () => {
      localStorage.removeItem('fb_history');
      renderHistory();
    });

    // ============================================================
    // NOTES — Workorder template builder
    // ============================================================

    const bulletContainer = document.getElementById('bulletContainer');
    const addBulletBtn = document.getElementById('addBulletBtn');
    const notePreview = document.getElementById('notePreview');

    // Note type toggle (Service Call vs Install Labor)
    document.querySelectorAll('.toggle-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        noteType = btn.dataset.type;
        updateNotePreview();
      });
    });

    // Add a bullet point row
    function addBullet(value = '') {
      const row = document.createElement('div');
      row.className = 'bullet-row';
      row.innerHTML = `
        <span>-</span>
        <input type="text" class="bullet-input" placeholder="Note..." value="${value}">
        <button class="remove-bullet">&times;</button>
      `;
      // Remove bullet on X click
      row.querySelector('.remove-bullet').addEventListener('click', () => {
        row.remove();
        updateNotePreview();
      });
      // Update preview as user types
      row.querySelector('input').addEventListener('input', updateNotePreview);
      bulletContainer.appendChild(row);
      // Focus the new input
      row.querySelector('input').focus();
      updateNotePreview();
    }

    addBulletBtn.addEventListener('click', () => addBullet());

    // Start with 3 empty bullets
    addBullet();
    addBullet();
    addBullet();

    // Listen for changes on all note fields
    ['noteTitle', 'noteModel', 'noteSerial'].forEach(id => {
      document.getElementById(id).addEventListener('input', updateNotePreview);
    });

    // Build the formatted note preview
    function updateNotePreview() {
      const title = document.getElementById('noteTitle').value || '(Title)';
      const model = document.getElementById('noteModel').value || '(Model)';
      const serial = document.getElementById('noteSerial').value || '(Serial)';
      const today = new Date().toLocaleDateString('en-US', {
        month: 'numeric', day: 'numeric', year: 'numeric'
      });

      // Gather bullet points (skip empty ones)
      const bullets = [];
      document.querySelectorAll('.bullet-input').forEach(input => {
        if (input.value.trim()) {
          bullets.push(`- ${input.value.trim()}`);
        }
      });
      const bulletText = bullets.length > 0
        ? bullets.join('\n')
        : '- ';

      // Build the closing line based on note type
      const closingLine = noteType === 'service'
        ? `### **Service call completed - ${today}**`
        : `### **Install Labor Completed - ${today}**`;

      // Assemble the full note in Dustin's format
      // Install Labor doesn't need M:/S: — already in the original service call note
      const modelSerial = noteType === 'service' ? `\nM: ${model}\n\nS: ${serial}\n` : '';
      const note = `## ${title}
___
${modelSerial}
${bulletText}

${closingLine}`;

      notePreview.textContent = note;
    }

    // Initial preview render
    updateNotePreview();

    // ============================================================
    // COPY NOTE TO CLIPBOARD
    // ============================================================

    document.getElementById('copyNoteBtn').addEventListener('click', async () => {
      const text = notePreview.textContent;
      const success = await copyToClipboard(text);
      if (success) {
        showToast('Copied!');
      } else {
        showToast('Copy failed — long press the preview to select manually');
      }
    });

    // ============================================================
    // SAVE / LOAD NOTES — localStorage
    // ============================================================

    document.getElementById('saveNoteBtn').addEventListener('click', () => {
      const title = document.getElementById('noteTitle').value || 'Untitled';
      const model = document.getElementById('noteModel').value;
      const serial = document.getElementById('noteSerial').value;
      const bullets = [];
      document.querySelectorAll('.bullet-input').forEach(input => {
        bullets.push(input.value);
      });

      const notes = JSON.parse(localStorage.getItem('fb_notes') || '[]');
      notes.unshift({
        id: Date.now(),
        title: title,
        model: model,
        serial: serial,
        bullets: bullets,
        noteType: noteType,
        date: new Date().toLocaleDateString(),
        fullText: notePreview.textContent
      });
      // Keep last 100 notes
      localStorage.setItem('fb_notes', JSON.stringify(notes.slice(0, 100)));
      showToast('Note saved!');
      renderSavedNotes();
    });

    document.getElementById('clearNoteBtn').addEventListener('click', () => {
      document.getElementById('noteTitle').value = '';
      document.getElementById('noteModel').value = '';
      document.getElementById('noteSerial').value = '';
      bulletContainer.innerHTML = '';
      addBullet();
      addBullet();
      addBullet();
      updateNotePreview();
    });

    function renderSavedNotes() {
      const notes = JSON.parse(localStorage.getItem('fb_notes') || '[]');
      const list = document.getElementById('savedNotesList');

      if (notes.length === 0) {
        list.innerHTML = '<div class="empty-state">No saved notes</div>';
        return;
      }

      list.innerHTML = '';
      notes.forEach(note => {
        const div = document.createElement('div');
        div.className = 'saved-note-item';
        div.innerHTML = `
          <div class="saved-note-title">${note.title}</div>
          <div class="saved-note-meta">M: ${note.model || '—'} | ${note.date}</div>
        `;
        // Click to load the note back into the form
        div.addEventListener('click', () => {
          document.getElementById('noteTitle').value = note.title;
          document.getElementById('noteModel').value = note.model || '';
          document.getElementById('noteSerial').value = note.serial || '';

          // Restore bullet points
          bulletContainer.innerHTML = '';
          if (note.bullets && note.bullets.length > 0) {
            note.bullets.forEach(b => addBullet(b));
          } else {
            addBullet();
          }

          // Restore note type
          noteType = note.noteType || 'service';
          document.querySelectorAll('.toggle-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.type === noteType);
          });

          updateNotePreview();
          showToast('Note loaded');
        });
        list.appendChild(div);
      });
    }

    // ============================================================
    // CLIPBOARD — Async function that tries the modern Clipboard
    // API first (needs HTTPS, which GitHub Pages gives us), then
    // falls back to the old execCommand method for HTTP/older browsers.
    // ============================================================

    async function copyToClipboard(text) {
      // Method 1: Modern Clipboard API (works on HTTPS)
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (e) {
          // Permission denied or other error — try fallback
          console.log('Clipboard API failed, trying fallback:', e);
        }
      }

      // Method 2: Old-school execCommand fallback (HTTP / older browsers)
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.fontSize = '16px';
      textarea.style.position = 'fixed';
      textarea.style.left = '0';
      textarea.style.top = '0';
      textarea.style.width = '1px';
      textarea.style.height = '1px';
      textarea.style.opacity = '0.01';
      textarea.setAttribute('readonly', '');

      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      textarea.setSelectionRange(0, text.length);

      let success = false;
      try {
        success = document.execCommand('copy');
      } catch (e) {
        success = false;
      }
      document.body.removeChild(textarea);
      return success;
    }

    // ============================================================
    // TOAST NOTIFICATION
    // ============================================================

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // ============================================================
    // OCR — Camera capture and text extraction
    // Uses Tesseract.js to read model/serial tags from photos.
    // Runs entirely in the browser — no server or API key needed.
    // ============================================================

    const cameraBtn = document.getElementById('cameraBtn');
    const cameraInput = document.getElementById('cameraInput');
    const ocrOverlay = document.getElementById('ocrOverlay');
    const ocrPreview = document.getElementById('ocrPreview');
    const ocrStatus = document.getElementById('ocrStatus');
    const ocrProgressBar = document.getElementById('ocrProgressBar');
    const ocrResults = document.getElementById('ocrResults');
    const ocrCloseBtn = document.getElementById('ocrCloseBtn');

    // Camera button opens the file picker (which triggers camera on mobile)
    cameraBtn.addEventListener('click', () => {
      cameraInput.click();
    });

    // ---- Image preprocessing: boost contrast + optional rotation ----
    // Appliance tags are often in bad lighting, at angles, or sideways.
    // Converting to high-contrast B&W helps Tesseract significantly.
    // rotationDeg: 0, 90, 180, or 270 — rotates the image before processing
    function preprocessImage(file, rotationDeg = 0) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          // ---- Downscale large images ----
          // iPhone photos are 4000+ px. Huge images are SLOWER and LESS
          // accurate for OCR — Tesseract works best around 1000-1500px.
          const MAX_DIM = 1500;
          let w = img.width;
          let h = img.height;
          if (Math.max(w, h) > MAX_DIM) {
            const scale = MAX_DIM / Math.max(w, h);
            w = Math.round(w * scale);
            h = Math.round(h * scale);
          }

          const canvas = document.createElement('canvas');

          // If rotating 90 or 270, swap width/height
          if (rotationDeg === 90 || rotationDeg === 270) {
            canvas.width = h;
            canvas.height = w;
          } else {
            canvas.width = w;
            canvas.height = h;
          }
          const ctx = canvas.getContext('2d');

          // Apply rotation around center, draw scaled image
          ctx.save();
          ctx.translate(canvas.width / 2, canvas.height / 2);
          ctx.rotate((rotationDeg * Math.PI) / 180);
          ctx.drawImage(img, -w / 2, -h / 2, w, h);
          ctx.restore();

          // Get pixel data and convert to high-contrast B&W
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = imageData.data;

          for (let i = 0; i < data.length; i += 4) {
            // Grayscale using luminance formula
            let gray = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
            // Contrast boost
            gray = ((gray / 255 - 0.5) * 1.5 + 0.5) * 255;
            gray = Math.max(0, Math.min(255, gray));
            // Threshold to pure B&W
            gray = gray > 128 ? 255 : 0;
            data[i] = gray;
            data[i+1] = gray;
            data[i+2] = gray;
          }

          ctx.putImageData(imageData, 0, 0);
          canvas.toBlob((blob) => {
            URL.revokeObjectURL(img.src);
            resolve(blob);
          }, 'image/png');
        };
        img.src = URL.createObjectURL(file);
      });
    }

    // ---- Run OCR on a preprocessed blob (helper) ----
    async function runOcrPass(blob, updateProgress) {
      const result = await Tesseract.recognize(blob, 'eng', {
        logger: (info) => {
          if (info.status === 'recognizing text' && updateProgress) {
            updateProgress(info.progress);
          }
        }
      });
      return result.data.text;
    }

    // ---- Score OCR results — higher = better text found ----
    // Used to compare 0° vs 90° rotation results
    function scoreOcrCandidates(candidates) {
      let score = 0;
      for (const c of candidates) {
        if (c.tag.includes('from label')) score += 10;  // labeled match = best
        else if (c.tag.includes('Likely model')) score += 5;
        else if (c.tag.includes('Likely serial')) score += 5;
        else if (c.tag.includes('Numeric code')) score += 2;
        else if (c.tag.includes('Short code')) score += 1;
      }
      return score;
    }

    // When a photo is captured/selected
    cameraInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // Show the overlay with preview of original image
      const imageUrl = URL.createObjectURL(file);
      ocrPreview.src = imageUrl;
      ocrOverlay.classList.add('visible');
      ocrStatus.textContent = 'Enhancing image...';
      ocrProgressBar.style.width = '0%';
      ocrResults.innerHTML = '';
      ocrCloseBtn.textContent = 'Cancel';

      try {
        // ---- Pass 1: Try the image at 0° (normal orientation) ----
        const blob0 = await preprocessImage(file, 0);
        ocrStatus.textContent = 'Reading tag...';

        const rawText0 = await runOcrPass(blob0, (progress) => {
          const pct = Math.round(progress * 50); // 0-50% for first pass
          ocrProgressBar.style.width = pct + '%';
          ocrStatus.textContent = `Reading... ${pct}%`;
        });

        let candidates = parseOcrText(rawText0);
        let score = scoreOcrCandidates(candidates);

        // ---- Pass 2: If 0° didn't find good results, try 90° rotation ----
        // Many appliance tags are mounted sideways (especially on sides/backs)
        if (score < 5) {
          ocrStatus.textContent = 'Trying rotated...';
          const blob90 = await preprocessImage(file, 90);

          const rawText90 = await runOcrPass(blob90, (progress) => {
            const pct = 50 + Math.round(progress * 25); // 50-75%
            ocrProgressBar.style.width = pct + '%';
            ocrStatus.textContent = `Trying rotated... ${pct}%`;
          });

          const candidates90 = parseOcrText(rawText90);
          const score90 = scoreOcrCandidates(candidates90);

          // ---- Pass 3: Also try 270° (rotated the other way) ----
          const blob270 = await preprocessImage(file, 270);

          const rawText270 = await runOcrPass(blob270, (progress) => {
            const pct = 75 + Math.round(progress * 25); // 75-100%
            ocrProgressBar.style.width = pct + '%';
            ocrStatus.textContent = `Trying rotated... ${pct}%`;
          });

          const candidates270 = parseOcrText(rawText270);
          const score270 = scoreOcrCandidates(candidates270);

          // Pick the best rotation
          if (score90 > score && score90 >= score270) {
            candidates = candidates90;
            score = score90;
          } else if (score270 > score) {
            candidates = candidates270;
            score = score270;
          }
        }

        ocrProgressBar.style.width = '100%';

        // ---- Show results ----
        if (candidates.length === 0) {
          ocrStatus.textContent = 'Could not find model/serial numbers';
          ocrResults.innerHTML = '<div class="empty-state">' +
            'Tips for better results:<br><br>' +
            '- Hold phone straight, parallel to the tag<br>' +
            '- Tag should fill most of the frame<br>' +
            '- Good lighting, avoid shadows<br>' +
            '- Wipe dust/grease off the tag' +
            '</div>';
        } else {
          ocrStatus.textContent = 'Select model or serial number:';
          ocrResults.innerHTML = '';
          candidates.forEach(item => {
            const div = document.createElement('div');
            div.className = 'ocr-result-item';
            div.innerHTML = `${item.text}<span class="ocr-tag">${item.tag}</span>`;

            div.addEventListener('click', () => {
              if (item.tag.includes('serial') || item.tag.includes('Serial')) {
                document.getElementById('noteSerial').value = item.text;
                showToast('Serial filled in Notes tab');
              } else {
                modelInput.value = item.text;
                modelInput.dispatchEvent(new Event('input'));
                document.getElementById('noteModel').value = item.text;
                showToast('Model number set: ' + item.text);
              }
              ocrOverlay.classList.remove('visible');
              cameraInput.value = '';
            });

            ocrResults.appendChild(div);
          });
        }
        ocrCloseBtn.textContent = 'Close';

      } catch (err) {
        ocrStatus.textContent = 'OCR failed — try again';
        ocrCloseBtn.textContent = 'Close';
        console.error('OCR error:', err);
      }

      URL.revokeObjectURL(imageUrl);
    });

    // Close the OCR overlay
    ocrCloseBtn.addEventListener('click', () => {
      ocrOverlay.classList.remove('visible');
      cameraInput.value = '';
    });

    // ============================================================
    // OCR TEXT PARSING
    // Extracts likely model and serial numbers from raw OCR text.
    // Model numbers: typically 8-15 chars, mix of letters and numbers
    // Serial numbers: typically longer, more numeric
    // ============================================================

    function parseOcrText(rawText) {
      const candidates = [];
      const seen = new Set();

      // ---- STEP 1: Look for labeled values ----
      // High-confidence matches — the value right after a label keyword.
      // Covers many formats: MOD., Model:, M/N, Service no., ART. NO., SERIAL NO., etc.
      const labelPatterns = [
        // Model labels: MODEL NUMBER, MODEL NO., MODEL NO:, MODEL#, MODEL:, MOD., M/N
        // The (?:NUMBER|NO\.?|#) group is key — without it, "MODEL NUMBER" would
        // capture "NUMBER" as the value instead of the actual model number after it
        { regex: /(?:MOD(?:EL)?\.?\s*(?:NUMBER|NO\.?|#)?\s*[:.]?\s*|M\/N\s*[:.]?\s*)([A-Za-z0-9][\w\-\.]{3,})/gi, type: 'model' },
        // Serial labels: SERIAL NUMBER, SERIAL NO., SER., S/N
        { regex: /(?:SER(?:IAL)?\.?\s*(?:NUMBER|NO\.?|#)?\s*[:.]?\s*|S\/N\s*[:.]?\s*)([A-Za-z0-9][\w\-\.]{3,})/gi, type: 'serial' },
        // Stock number (Whirlpool uses this)
        { regex: /(?:STOCK\s*(?:NUMBER|NO\.?|#)?\s*[:.]?\s*)([A-Za-z0-9][\w\-\.]{3,})/gi, type: 'model' },
        // Service no. / Service number (Miele, Bosch, European brands)
        { regex: /(?:SERVICE\s*(?:NO\.?|NUMBER|#)\s*[:.]?\s*)([A-Za-z0-9][\w\-\.]{3,})/gi, type: 'model' },
        // ART. NO. / Article Number / Art. Nr. (European brands)
        { regex: /(?:ART(?:ICLE)?\.?\s*(?:NO\.?|NR\.?|NUMBER|#)\s*[:.]?\s*)([A-Za-z0-9][\w\-\.\/]{3,})/gi, type: 'part' },
        // P/N, Part No., Part Number
        { regex: /(?:P\/N\s*[:.]?\s*|PART\s*(?:NO\.?|NUMBER|#)\s*[:.]?\s*)([A-Za-z0-9][\w\-\.]{3,})/gi, type: 'part' },
        // TYPE / Type: (some brands label model as "Type")
        { regex: /(?:TYPE\.?\s*[:.]?\s*)([A-Za-z0-9][\w\-\.]{3,})/gi, type: 'model' },
      ];

      labelPatterns.forEach(({ regex, type }) => {
        let match;
        while ((match = regex.exec(rawText)) !== null) {
          const value = match[1].replace(/[^A-Za-z0-9\-]/g, '').toUpperCase();
          if (value.length >= 4 && !seen.has(value)) {
            seen.add(value);
            const tagName = type === 'serial' ? 'Serial (from label)'
              : type === 'part' ? 'Part number (from label)'
              : 'Model (from label)';
            candidates.push({ text: value, tag: tagName });
          }
        }
      });

      // ---- STEP 2: Find other alphanumeric codes that look like model/serial ----
      const cleanedText = rawText.replace(/[|\\\/\[\]{}()]/g, ' ');
      const tokens = cleanedText
        .split(/[\s,;:]+/)
        .map(t => t.trim().replace(/^[.\-_]+|[.\-_]+$/g, ''))
        .filter(t => t.length >= 3);

      // Words to skip — common label text on appliance tags
      const skipWords = new Set(['MODEL', 'SERIAL', 'NUMBER', 'STOCK', 'TYPE',
        'STYLE', 'COLOR', 'SIZE', 'BRAND', 'MOTOR', 'HEATER', 'TOTAL',
        'MADE', 'USA', 'CHINA', 'MEXICO', 'KOREA', 'DATE', 'MFG', 'PROD',
        'RATING', 'VOLTS', 'AMPS', 'WATTS', 'HERTZ', 'PHASE', 'CYCLE',
        'THIS', 'THE', 'FOR', 'WITH', 'FROM', 'LISTED', 'MANUFACTURED',
        'PATENT', 'WARNING', 'CAUTION', 'DANGER', 'IMPORTANT', 'NOTE',
        'SEE', 'USE', 'ONLY', 'NOT', 'AND', 'MAX', 'MIN', 'REF', 'CAT',
        'UNIT', 'MOD', 'SER', 'CORP', 'CORPORATION', 'INC', 'WHIRLPOOL',
        'SAMSUNG', 'FRIGIDAIRE', 'ELECTROLUX', 'BOSCH', 'THERMADOR',
        'MAYTAG', 'KITCHENAID', 'AMANA', 'VIKING', 'MIELE', 'TEST',
        'PRESSURES', 'BENTON', 'HARBOR', 'MICHIGAN', 'SERVICE',
        'MARCA', 'REGISTRADA', 'ARTICLE']);

      tokens.forEach(token => {
        const cleaned = token.replace(/[^A-Za-z0-9\-]/g, '');
        if (cleaned.length < 3) return;

        const upper = cleaned.toUpperCase();
        if (seen.has(upper)) return;
        if (skipWords.has(upper)) return;

        seen.add(upper);

        const hasLetter = /[A-Za-z]/.test(cleaned);
        const hasNumber = /[0-9]/.test(cleaned);
        const digitRatio = (upper.match(/[0-9]/g) || []).length / upper.length;

        let tag;
        if (hasLetter && hasNumber && upper.length >= 6) {
          tag = (upper.length > 14 || digitRatio > 0.7) ? 'Likely serial' : 'Likely model';
        } else if (hasNumber && !hasLetter && upper.length >= 6) {
          tag = 'Numeric code';
        } else if (hasLetter && hasNumber) {
          tag = 'Short code';
        } else {
          return;
        }

        candidates.push({ text: upper, tag: tag });
      });

      // Sort: labeled matches first, then likely model, serial, then others
      const priority = {
        'Model (from label)': 0,
        'Serial (from label)': 1,
        'Part number (from label)': 2,
        'Likely model': 3,
        'Likely serial': 4,
        'Short code': 5,
        'Numeric code': 6
      };
      candidates.sort((a, b) => (priority[a.tag] || 9) - (priority[b.tag] || 9));

      return candidates;
    }

    // ============================================================
    // PARTS TAB — Send part orders to Google Sheets
    // ============================================================

    // Google Apps Script Web App URL — set this after deploying the script
    // (see instructions in the repo README or braindump notes)
    let SHEETS_SCRIPT_URL = localStorage.getItem('fb_sheets_url') || '';

    let partStatus = 'aa'; // 'aa' or 'date'

    // Status toggle (AA vs Approved Date)
    document.querySelectorAll('[data-status]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-status]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        partStatus = btn.dataset.status;
        // Show/hide date picker
        document.getElementById('partDateRow').style.display =
          partStatus === 'date' ? 'block' : 'none';
        updatePartPreview();
      });
    });

    // Set default date to today
    document.getElementById('partDate').valueAsDate = new Date();

    // Update preview as fields change
    ['partNumber', 'partDesc'].forEach(id => {
      document.getElementById(id).addEventListener('input', updatePartPreview);
    });
    document.getElementById('partDate').addEventListener('change', updatePartPreview);

    // Build the Column C preview: ***P# [number]*** **[description]**
    function updatePartPreview() {
      const num = document.getElementById('partNumber').value || '(part #)';
      const desc = document.getElementById('partDesc').value || '(description)';
      document.getElementById('partPreview').textContent =
        `***P# ${num}*** **${desc}**`;
    }
    updatePartPreview();

    // Get the status value (date string or "Aa")
    function getPartStatusValue() {
      if (partStatus === 'aa') return 'Aa';
      return document.getElementById('partDate').value || 'Aa';
    }

    // Send to Google Sheet
    document.getElementById('sendToSheetBtn').addEventListener('click', async () => {
      const customer = document.getElementById('partCustomer').value.trim();
      const invoice = document.getElementById('partInvoice').value.trim();
      const partNum = document.getElementById('partNumber').value.trim();
      const partDesc = document.getElementById('partDesc').value.trim();
      const status = getPartStatusValue();

      if (!customer || !partNum) {
        showToast('Need at least customer name and part #');
        return;
      }

      // Format Column C: ***P# [number]*** **[description]**
      const colC = partDesc
        ? `***P# ${partNum}*** **${partDesc}**`
        : `***P# ${partNum}***`;

      const highlight = document.getElementById('partWarranty').checked;

      // Check if Google Sheets URL is configured
      if (!SHEETS_SCRIPT_URL) {
        // Prompt for the script URL on first use
        const url = prompt(
          'Paste your Google Apps Script Web App URL.\n\n' +
          '(You only need to do this once — it will be saved.)\n\n' +
          'See setup instructions in the Parts tab.'
        );
        if (!url) return;
        SHEETS_SCRIPT_URL = url.trim();
        localStorage.setItem('fb_sheets_url', SHEETS_SCRIPT_URL);
      }

      // Send data to Google Apps Script
      const sendBtn = document.getElementById('sendToSheetBtn');
      sendBtn.textContent = 'Sending...';
      sendBtn.disabled = true;

      try {
        // Use a hidden iframe to call the Apps Script URL.
        // This is the most reliable method — iframe navigation has ZERO
        // CORS restrictions, unlike fetch() which gets blocked by the
        // redirect Google Apps Script does (script.google.com → googleusercontent.com).
        const params = new URLSearchParams({
          customer: customer,
          invoice: invoice,
          partInfo: colC,
          status: status,
          highlight: highlight ? 'true' : 'false'
        });
        const fullUrl = SHEETS_SCRIPT_URL + '?' + params.toString();

        // JSONP: inject a <script> tag that calls our callback with the real response.
        // Unlike the old iframe approach, this lets us read success/error from Apps Script.
        await new Promise((resolve, reject) => {
          const cbName = '_sheetCb_' + Date.now();
          const script = document.createElement('script');

          // Cleanup helper — removes script tag and global callback
          const cleanup = () => {
            delete window[cbName];
            if (script.parentNode) script.parentNode.removeChild(script);
          };

          // Apps Script calls this function with the JSON response
          window[cbName] = (data) => {
            cleanup();
            if (data && data.status === 'ok') {
              // Debug: log where data went (remove after confirming fix)
              if (data.sheetName) {
                console.log('Sheet debug:', data);
                alert('Wrote to row ' + data.row + ' in "' + data.tabName + '" tab of "' + data.sheetName + '"\n\n' + data.sheetUrl);
              }
              resolve();
            } else {
              reject(new Error(data && data.message ? data.message : 'Unknown error from Google Sheets'));
            }
          };

          // Network failure fires onerror (unlike iframe which fires onload for everything)
          script.onerror = () => {
            cleanup();
            reject(new Error('Could not reach Google Sheets'));
          };

          script.src = fullUrl + '&callback=' + cbName;
          document.body.appendChild(script);

          // Timeout after 15 seconds — now rejects instead of silently succeeding
          setTimeout(() => {
            if (window[cbName]) {
              cleanup();
              reject(new Error('Google Sheets request timed out'));
            }
          }, 15000);
        });

        showToast(highlight ? 'Sent (warranty — yellow)!' : 'Sent to Google Sheet!');

        // Log it locally
        saveToPartsLog(customer, invoice, colC, status, highlight);

        // Clear part fields (keep customer & invoice for multi-part orders)
        document.getElementById('partNumber').value = '';
        document.getElementById('partDesc').value = '';
        updatePartPreview();

      } catch (err) {
        showToast('Failed: ' + err.message);
        console.error('Sheet send error:', err);
      }

      sendBtn.textContent = 'Send to Google Sheet';
      sendBtn.disabled = false;
    });

    // "Add Another Part" — clears part fields but keeps customer/invoice
    document.getElementById('addAnotherPartBtn').addEventListener('click', () => {
      document.getElementById('partNumber').value = '';
      document.getElementById('partDesc').value = '';
      updatePartPreview();
      document.getElementById('partNumber').focus();
      showToast('Add next part for same customer');
    });

    // Clear all parts fields
    document.getElementById('clearPartsBtn').addEventListener('click', () => {
      document.getElementById('partCustomer').value = '';
      document.getElementById('partInvoice').value = '';
      document.getElementById('partNumber').value = '';
      document.getElementById('partDesc').value = '';
      partStatus = 'aa';
      document.querySelectorAll('[data-status]').forEach(b => {
        b.classList.toggle('active', b.dataset.status === 'aa');
      });
      document.getElementById('partDateRow').style.display = 'none';
      document.getElementById('partWarranty').checked = false;
      updatePartPreview();
    });

    // Reset Sheet URL — in case the saved URL is wrong
    document.getElementById('resetSheetUrlBtn').addEventListener('click', () => {
      const current = SHEETS_SCRIPT_URL || '(not set)';
      const url = prompt(
        'Current URL:\n' + current + '\n\nPaste new Google Apps Script Web App URL:'
      );
      if (url) {
        SHEETS_SCRIPT_URL = url.trim();
        localStorage.setItem('fb_sheets_url', SHEETS_SCRIPT_URL);
        showToast('Sheet URL updated');
      }
    });

    // Test Sheet Connection — sends a no-data JSONP ping to verify the URL works
    document.getElementById('testSheetBtn').addEventListener('click', () => {
      if (!SHEETS_SCRIPT_URL) {
        showToast('No Sheet URL set — click "Change Sheet URL" first');
        return;
      }
      const testBtn = document.getElementById('testSheetBtn');
      testBtn.textContent = 'Testing...';
      testBtn.disabled = true;

      const cbName = '_sheetTest_' + Date.now();
      const script = document.createElement('script');
      const cleanup = () => {
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
        testBtn.textContent = 'Test Sheet Connection';
        testBtn.disabled = false;
      };

      window[cbName] = (data) => {
        cleanup();
        if (data && data.status === 'ok') {
          showToast('Connection OK!');
        } else {
          showToast('Error: ' + (data && data.message ? data.message : 'Unknown'));
        }
      };

      script.onerror = () => {
        cleanup();
        showToast('Failed — could not reach Google Sheets');
      };

      // Call with just the callback param (no customer = status check only)
      script.src = SHEETS_SCRIPT_URL + '?callback=' + cbName;
      document.body.appendChild(script);

      setTimeout(() => {
        if (window[cbName]) {
          cleanup();
          showToast('Timed out — check URL and try again');
        }
      }, 15000);
    });

    // Parts log — saved locally for reference
    function saveToPartsLog(customer, invoice, partInfo, status, highlight) {
      const log = JSON.parse(localStorage.getItem('fb_parts_log') || '[]');
      log.unshift({
        customer, invoice, partInfo, status, highlight,
        date: new Date().toLocaleString()
      });
      localStorage.setItem('fb_parts_log', JSON.stringify(log.slice(0, 200)));
      renderPartsLog();
    }

    function renderPartsLog() {
      const log = JSON.parse(localStorage.getItem('fb_parts_log') || '[]');
      const list = document.getElementById('partsLog');

      if (log.length === 0) {
        list.innerHTML = '<div class="empty-state">No parts sent yet</div>';
        return;
      }

      list.innerHTML = '';
      log.forEach(item => {
        const div = document.createElement('div');
        div.className = 'saved-note-item';
        div.innerHTML = `
          <div class="saved-note-title">${item.highlight ? '🟡 ' : ''}${item.customer}</div>
          <div class="saved-note-meta">
            Inv: ${item.invoice || '—'} | ${item.partInfo} | ${item.status} | ${item.date}
          </div>
        `;
        list.appendChild(div);
      });
    }

    // ============================================================
    // INITIALIZATION
    // ============================================================

    // Render history, saved notes, and parts log on load
    renderHistory();
    renderSavedNotes();
    renderPartsLog();

    // Register service worker for offline support
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service worker registered'))
        .catch((err) => console.log('SW registration failed:', err));
    }
  </script>
