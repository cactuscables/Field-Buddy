<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes it mobile-friendly — scales to phone screen width -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <!-- PWA stuff — theme color for browser chrome, manifest for install -->
  <meta name="theme-color" content="#16213e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tech Portal">
  <link rel="manifest" href="manifest.json">
  <!-- Tesseract.js for OCR — runs entirely in the browser, no server needed -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <!-- Industrial typography — Barlow Condensed for headers/labels -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <title>Tech Portal</title>

  <style>
    /* ========================================
       BASE STYLES — Dark theme, mobile-first
       ======================================== */
    :root {
      /* Industrial dark palette */
      --bg: #111118;
      --surface: #1a1f2e;
      --input-bg: #0d1220;
      --primary: #e94560;
      --primary-dark: #c73650;
      --secondary: #3d7fff;
      --text: #f0f0f0;
      --text-muted: #8890a0;
      --border: #2a3040;
      --success: #22c55e;
      --warning: #eab308;

      /* Typography */
      --font-display: 'Barlow Condensed', sans-serif;
      --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', 'Courier New', monospace;

      /* Spacing */
      --radius: 8px;
      --radius-sm: 6px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overscroll-behavior: none;
      /* Subtle noise texture for industrial feel */
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    }

    .tab-content {
      display: none;
      padding: 20px;
      padding-bottom: 100px;
      max-width: 600px;
      margin: 0 auto;
    }

    .tab-content.active {
      display: block;
    }

    /* ========================================
       FORM ELEMENTS — Inputs, selects, buttons
       ======================================== */
    label {
      display: block;
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      margin-top: 18px;
    }

    label:first-child {
      margin-top: 0;
    }

    input[type="text"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 16px 18px;
      background: var(--input-bg);
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 18px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
      min-height: 54px;
    }

    input[type="text"]:focus,
    input[type="date"]:focus,
    select:focus,
    textarea:focus {
      border-color: var(--primary);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .btn-primary {
      width: 100%;
      padding: 18px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 20px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: background 0.15s, transform 0.1s;
      min-height: 60px;
    }

    .btn-primary:active {
      background: var(--primary-dark);
      transform: scale(0.97);
    }

    .btn-secondary {
      width: 100%;
      padding: 14px;
      background: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
      border-radius: var(--radius-sm);
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      transition: all 0.15s, transform 0.1s;
      min-height: 48px;
    }

    .btn-secondary:active {
      background: var(--primary);
      color: white;
      transform: scale(0.97);
    }

    .btn-small {
      padding: 14px 20px;
      background: var(--surface);
      color: var(--text);
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      margin-right: 8px;
      min-height: 48px;
      transition: border-color 0.15s, transform 0.1s;
    }

    .btn-small:active {
      border-color: var(--primary);
      transform: scale(0.97);
    }

    /* ========================================
       BRAND QUICK-PICK CHIPS
       ======================================== */
    .brand-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
    }

    .brand-chip {
      padding: 12px 18px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 24px;
      color: var(--text-muted);
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s, transform 0.1s;
      min-height: 48px;
      display: flex;
      align-items: center;
    }

    .brand-chip.selected {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .brand-chip:active {
      transform: scale(0.95);
    }

    /* ========================================
       SEARCH RESULTS — Link list
       ======================================== */
    .results-section {
      margin-top: 20px;
      display: none;
    }

    .results-section.visible {
      display: block;
    }

    .result-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background: var(--surface);
      border-radius: var(--radius);
      margin-bottom: 10px;
      text-decoration: none;
      color: var(--text);
      border: 2px solid var(--border);
      transition: border-color 0.15s;
      min-height: 56px;
    }

    .result-link:active {
      border-color: var(--primary);
    }

    .result-link .site-name {
      font-weight: 700;
      font-size: 16px;
    }

    .result-link .site-note {
      font-size: 13px;
      color: var(--text-muted);
    }

    .result-link .arrow {
      color: var(--primary);
      font-size: 18px;
    }

    /* ========================================
       NOTES SECTION
       ======================================== */
    .note-preview {
      background: var(--input-bg);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-top: 16px;
      font-family: var(--font-mono);
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-wrap;
      color: var(--text-muted);
      min-height: 120px;
    }

    .toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--success);
      color: white;
      padding: 14px 28px;
      border-radius: var(--radius);
      font-weight: 700;
      font-size: 16px;
      opacity: 0;
      transition: all 0.2s;
      pointer-events: none;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ========================================
       HISTORY SECTION
       ======================================== */
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      cursor: pointer;
      min-height: 56px;
      transition: border-color 0.15s;
    }

    .history-item:active {
      border-color: var(--primary);
    }

    .history-model {
      font-weight: 700;
      font-size: 16px;
    }

    .history-brand {
      font-size: 13px;
      color: var(--text-muted);
    }

    .history-date {
      font-size: 13px;
      color: var(--text-muted);
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
    }

    /* ========================================
       NOTE TYPE TOGGLE (Service Call vs Install)
       ======================================== */
    .toggle-group {
      display: flex;
      gap: 0;
      margin-top: 8px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid var(--border);
    }

    .toggle-btn {
      flex: 1;
      padding: 16px;
      background: var(--input-bg);
      border: none;
      color: var(--text-muted);
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      min-height: 52px;
      letter-spacing: 0.5px;
    }

    .toggle-btn.active {
      background: var(--primary);
      color: white;
    }

    /* Bullet point rows */
    .bullet-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .bullet-row span {
      color: var(--primary);
      font-weight: bold;
      font-size: 20px;
    }

    .bullet-row input {
      flex: 1;
    }

    .remove-bullet {
      background: rgba(233, 69, 96, 0.15);
      border: none;
      color: var(--primary);
      font-size: 22px;
      cursor: pointer;
      padding: 0;
      width: 48px;
      height: 48px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s;
    }

    .remove-bullet:active {
      background: rgba(233, 69, 96, 0.3);
    }

    /* ========================================
       SAVED NOTES LIST
       ======================================== */
    .saved-note-item {
      padding: 16px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .saved-note-item:active {
      border-color: var(--primary);
    }

    .saved-note-title {
      font-weight: 700;
      font-size: 16px;
    }

    .saved-note-meta {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .section-divider {
      border: none;
      border-top: 2px dashed var(--border);
      margin: 24px 0;
    }

    /* ========================================
       OCR / CAMERA FEATURE
       ======================================== */
    .input-with-camera {
      display: flex;
      gap: 8px;
    }

    .input-with-camera input {
      flex: 1;
    }

    .camera-btn {
      width: 56px;
      height: 56px;
      background: var(--primary);
      border: none;
      border-radius: var(--radius-sm);
      color: white;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }

    .camera-btn:active {
      background: var(--primary-dark);
      transform: scale(0.95);
    }

    #cameraInput {
      display: none;
    }

    .ocr-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 200;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .ocr-overlay.visible {
      display: flex;
    }

    .ocr-status {
      color: var(--primary);
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .ocr-progress {
      width: 220px;
      height: 8px;
      background: var(--surface);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .ocr-progress-bar {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s;
    }

    .ocr-preview {
      max-width: 300px;
      max-height: 200px;
      border-radius: 8px;
      margin-bottom: 20px;
      object-fit: contain;
    }

    .ocr-results {
      width: 100%;
      max-width: 400px;
      max-height: 50vh;
      overflow-y: auto;
    }

    .ocr-results label {
      color: var(--primary);
      margin-bottom: 8px;
    }

    .ocr-result-item {
      padding: 16px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 8px;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 16px;
      cursor: pointer;
      min-height: 56px;
      transition: border-color 0.15s;
    }

    .ocr-result-item:active {
      border-color: var(--primary);
    }

    .ocr-result-item .ocr-tag {
      font-family: var(--font-body);
      font-size: 12px;
      color: var(--text-muted);
      display: block;
      margin-top: 4px;
    }

    .ocr-close-btn {
      margin-top: 16px;
      padding: 16px 36px;
      background: transparent;
      color: var(--text-muted);
      border: 2px solid var(--text-muted);
      border-radius: var(--radius-sm);
      font-size: 16px;
      cursor: pointer;
      min-height: 52px;
    }

    /* ========================================
       STOCK TAB — Truck inventory table
       ======================================== */
    .stock-controls {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 6px;
    }

    .stock-controls input {
      flex: 1;
    }

    .stock-last-updated {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .stock-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }

    .stock-table th {
      text-align: left;
      padding: 12px 8px;
      color: var(--text-muted);
      border-bottom: 2px solid var(--border);
      font-family: var(--font-display);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stock-table td {
      padding: 12px 8px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }

    .stock-table td:first-child {
      font-family: var(--font-mono);
      font-size: 14px;
    }

    .stock-table td:last-child {
      text-align: right;
      font-weight: 700;
      white-space: nowrap;
    }

    .stock-row-out td {
      background: rgba(233, 69, 96, 0.15);
      color: var(--primary);
    }

    .stock-row-low td {
      background: rgba(234, 179, 8, 0.12);
      color: var(--warning);
    }

    /* ========================================
       BOTTOM TAB BAR — Primary navigation
       ======================================== */
    .bottom-tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      background: var(--surface);
      border-top: 2px solid var(--border);
      z-index: 100;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }

    .bottom-tab-btn {
      flex: 1;
      padding: 8px 0 6px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      min-height: 60px;
      justify-content: center;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      transition: color 0.15s;
      position: relative;
    }

    .bottom-tab-btn .tab-icon {
      font-size: 22px;
      line-height: 1;
    }

    .bottom-tab-btn.active {
      color: var(--primary);
    }

    .bottom-tab-btn.active::before {
      content: '';
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 3px;
      background: var(--primary);
      border-radius: 0 0 3px 3px;
    }

    .bottom-tab-btn.menu-btn {
      color: var(--text-muted);
    }

    /* ========================================
       JOB CONTEXT BAR — Replaces static header
       ======================================== */
    .job-context-bar {
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 56px;
    }

    .job-context-bar .app-title {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: 2px;
    }

    .job-context-bar .job-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .job-context-bar .job-info {
      display: none;
      flex: 1;
    }

    .job-context-bar.has-job .app-title-wrap {
      display: none;
    }

    .job-context-bar.has-job .job-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .job-model {
      font-family: var(--font-mono);
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    .job-brand-chip {
      padding: 4px 12px;
      background: var(--primary);
      border-radius: 12px;
      color: white;
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .job-customer {
      font-size: 14px;
      color: var(--text-muted);
      margin-left: auto;
    }

    .job-clear-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
      padding: 8px;
      margin-left: 8px;
    }

    .job-detail-panel {
      display: none;
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      padding: 0 20px 16px;
    }

    .job-detail-panel.visible {
      display: block;
    }

    /* ========================================
       SECONDARY MENU OVERLAY
       ======================================== */
    .menu-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 150;
    }

    .menu-overlay.visible {
      display: block;
    }

    .menu-drawer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 2px solid var(--border);
      border-radius: 16px 16px 0 0;
      padding: 20px;
      padding-bottom: calc(20px + env(safe-area-inset-bottom, 0));
      z-index: 151;
      transform: translateY(100%);
      transition: transform 0.25s ease-out;
    }

    .menu-overlay.visible .menu-drawer {
      transform: translateY(0);
    }

    .menu-drawer-handle {
      width: 40px;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 16px;
      background: var(--input-bg);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      cursor: pointer;
      min-height: 60px;
      transition: border-color 0.15s;
    }

    .menu-item:active {
      border-color: var(--primary);
    }

    .menu-item-icon {
      font-size: 24px;
    }

    .menu-item-label {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
/* ========================================
   NOTES TAB IMPROVEMENTS
   ======================================== */
/* Sticky notes action bar */
.notes-sticky-footer {
  position: sticky;
  bottom: 80px;
  background: var(--bg);
  padding: 12px 0;
  border-top: 2px dashed var(--border);
  margin-top: 20px;
  z-index: 10;
}

/* Collapsible preview */
.preview-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  padding: 12px 0;
}

.preview-toggle .toggle-arrow {
  transition: transform 0.2s;
  font-size: 16px;
  color: var(--text-muted);
}

.preview-toggle.open .toggle-arrow {
  transform: rotate(180deg);
}

.preview-collapsible {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.25s ease-out;
}

.preview-collapsible.open {
  max-height: 500px;
}

/* ========================================
   PARTS TAB — Quick Send Mode
   ======================================== */
.parts-context-strip {
  display: none;
  padding: 12px 16px;
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 16px;
  cursor: pointer;
  transition: border-color 0.15s;
}

.parts-context-strip.visible {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.parts-context-strip:active {
  border-color: var(--primary);
}

.parts-context-strip .strip-info {
  font-size: 15px;
  color: var(--text);
}

.parts-context-strip .strip-info span {
  color: var(--text-muted);
  font-size: 13px;
}

.parts-context-strip .strip-edit {
  color: var(--secondary);
  font-size: 13px;
  font-family: var(--font-display);
  letter-spacing: 0.5px;
}

.parts-full-form.collapsed {
  display: none;
}
  </style>
</head>

<body>

  <!-- ==================== JOB CONTEXT BAR ==================== -->
  <div class="job-context-bar" id="jobContextBar">
    <!-- Default state: app title -->

  <!-- ==================== SECONDARY MENU OVERLAY ==================== -->
  <div class="menu-overlay" id="menuOverlay">

  <script>
    // ============================================================
    // CONFIGURATION — Edit these URLs if site patterns change
    // ============================================================

    // Each brand maps to a list of sites to search.
    // {model} gets replaced with the actual model number.
    // "always" sites show for every brand, brand-specific sites add on top.

    const SITES = {
      // These show for EVERY brand
      always: [
        {
          name: 'Marcone',
          // Deep-link into Marcone search results for this model number
          url: 'https://beta.marcone.com/Home/RunSearchPartModelList?searchString={model}&type=Part',
          note: 'Pricing & availability'
        },
        {
          name: 'Sears Parts Direct',
          url: 'https://www.searspartsdirect.com/search?q={model}',
          note: 'Parts breakdown'
        },
        {
          name: 'Reliable Parts',
          // Opens Reliable Parts search results
          url: 'https://www.reliableparts.com/catalogsearch/result/?q={model}#models',
          note: 'Parts lookup'
        }
      ],

      // Brand-specific sites — these get ADDED to the "always" list
      bosch: [
        {
          name: 'Bosch Parts',
          url: 'https://www.bosch-home.com/us/owner-support/cleaners-accessories/spare-parts-test',
          note: 'Manufacturer parts lookup'
        }
      ],
      thermador: [
        {
          name: 'Thermador Parts',
          url: 'https://www.thermador.com/us/support/spareparts',
          note: 'Manufacturer parts lookup'
        }
      ],
      viking: [
        {
          name: 'All Viking Parts',
          url: 'https://www.allvikingparts.com/',
          note: 'Part numbers'
        }
      ],
      ge: [
        {
          name: 'GE Parts',
          url: 'https://www.geapplianceparts.com/store/parts/search/model/{model}',
          note: 'Manufacturer parts lookup'
        }
      ]
    };

    // ============================================================
    // BRAND AUTO-DETECTION
    // Model number prefixes mapped to brands.
    // These are common patterns — not exhaustive. Manual override
    // is always available via the chips.
    // ============================================================

    const BRAND_PATTERNS = [
      // KitchenAid — starts with K (ranges, dishwashers, fridges)
      { prefix: /^K/i, brand: 'kitchenaid' },
      // Whirlpool — starts with W
      { prefix: /^W/i, brand: 'whirlpool' },
      // Maytag — starts with M
      { prefix: /^M/i, brand: 'maytag' },
      // Amana — starts with A (but be careful, not all A-models are Amana)
      { prefix: /^A/i, brand: 'amana' },
      // Samsung — common prefixes
      { prefix: /^(RF|WF|DW|NE|NX|RS|RT|ME|MC|RB|RH|WA|DV|WV)/i, brand: 'samsung' },
      // LG — common prefixes
      { prefix: /^(LR|WM|LD|LDF|LSE|LDE|LT|LW|DL|LRMVS|LRFXS|LFXS)/i, brand: 'lg' },
      // Frigidaire — starts with FF, FG, FRT
      { prefix: /^(FF|FG|FRT|FGHB|FFSS|FGHS)/i, brand: 'frigidaire' },
      // Electrolux — starts with EI, EW, EFLS
      { prefix: /^(EI|EW|EFLS|ELF)/i, brand: 'electrolux' },
      // GE — common prefixes (lots of variation)
      { prefix: /^(GS|GT|JB|GFW|GDT|PFE|PSE|JGB|GNE|PYE|GDF|PDP|PDT)/i, brand: 'ge' },
      // Bosch — starts with SH (dishwashers), B, HBL, HGI
      { prefix: /^(SH|HBL|HGI|HDI|NGM|NIT|SHPM|SHEM|B[0-9])/i, brand: 'bosch' },
      // Thermador — common prefixes
      { prefix: /^(PRD|PRL|SGS|DWHD|PODS|MED|T[0-9]{2})/i, brand: 'thermador' },
      // Viking — starts with V
      { prefix: /^V/i, brand: 'viking' },
    ];

    // ============================================================
    // APP STATE
    // ============================================================

    let selectedBrand = null;
    let noteType = 'service'; // 'service' or 'install'

    // ============================================================
    // JOB CONTEXT — Central state that flows to all tabs
    // ============================================================

    const currentJob = {
      modelNumber: '',
      serialNumber: '',
      brand: '',
      customerName: '',
      invoiceNum: ''
    };

    // Load persisted job from localStorage
    function loadJob() {
      const saved = localStorage.getItem('fb_current_job');
      if (saved) {
        try {
          Object.assign(currentJob, JSON.parse(saved));
          updateJobUI();
        } catch (e) { /* ignore corrupted data */ }
      }
    }

    // Save job to localStorage
    function saveJob() {
      localStorage.setItem('fb_current_job', JSON.stringify(currentJob));
    }

    // Update a job field and propagate to all tabs
    function setJobField(key, value) {
      if (currentJob[key] === value) return; // No change, skip propagation
      currentJob[key] = value;
      saveJob();
      updateJobUI();
      propagateJobData();
    }

    // Check if a job is active (at least model number set)
    function hasActiveJob() {
      return !!(currentJob.modelNumber || currentJob.customerName);
    }

    // Update the context bar display
    function updateJobUI() {
      const bar = document.getElementById('jobContextBar');
      const active = hasActiveJob();

      bar.classList.toggle('has-job', active);

      if (active) {
        document.getElementById('jobBarModel').textContent = currentJob.modelNumber || '—';
        const brandChipEl = document.getElementById('jobBarBrand');
        if (currentJob.brand) {
          brandChipEl.textContent = currentJob.brand;
          brandChipEl.style.display = '';
        } else {
          brandChipEl.style.display = 'none';
        }
        document.getElementById('jobBarCustomer').textContent = currentJob.customerName || '';
      }

      // Sync the detail panel fields
      document.getElementById('jobModel').value = currentJob.modelNumber;
      document.getElementById('jobSerial').value = currentJob.serialNumber;
      document.getElementById('jobCustomer').value = currentJob.customerName;
      document.getElementById('jobInvoice').value = currentJob.invoiceNum;
    }

    // Push job data into all tab fields
    function propagateJobData() {
      // Lookup tab
      if (currentJob.modelNumber) {
        document.getElementById('modelInput').value = currentJob.modelNumber;
        if (currentJob.brand) selectBrand(currentJob.brand);
      }

      // Notes tab
      document.getElementById('noteModel').value = currentJob.modelNumber;
      document.getElementById('noteSerial').value = currentJob.serialNumber;

      // Parts tab
      document.getElementById('partCustomer').value = currentJob.customerName;
      document.getElementById('partInvoice').value = currentJob.invoiceNum;

      // Update note preview since model/serial may have changed
      updateNotePreview();
    }

    // Clear the current job
    function clearJob() {
      currentJob.modelNumber = '';
      currentJob.serialNumber = '';
      currentJob.brand = '';
      currentJob.customerName = '';
      currentJob.invoiceNum = '';
      saveJob();
      updateJobUI();
    }

    // ============================================================
    // TAB SWITCHING — Bottom tab bar + menu
    // ============================================================

    function switchTab(tabName) {
      // Deactivate all tabs and panels
      document.querySelectorAll('.bottom-tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      // Activate the target panel
      document.getElementById(tabName).classList.add('active');
      // Activate the matching bottom tab button (if it's a primary tab)
      const matchingBtn = document.querySelector(`.bottom-tab-btn[data-tab="${tabName}"]`);
      if (matchingBtn) matchingBtn.classList.add('active');
    }

    // Primary tab buttons
    document.querySelectorAll('.bottom-tab-btn[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        switchTab(btn.dataset.tab);
      });
    });

    // Menu toggle
    document.getElementById('menuToggleBtn').addEventListener('click', () => {
      document.getElementById('menuOverlay').classList.add('visible');
    });

    // Menu items open secondary tabs
    document.querySelectorAll('[data-menu-tab]').forEach(item => {
      item.addEventListener('click', () => {
        const tabName = item.dataset.menuTab;
        switchTab(tabName);
        document.getElementById('menuOverlay').classList.remove('visible');
      });
    });

    // Close menu on overlay backdrop click
    document.getElementById('menuOverlay').addEventListener('click', (e) => {
      if (e.target === document.getElementById('menuOverlay')) {
        document.getElementById('menuOverlay').classList.remove('visible');
      }
    });

    // ============================================================
    // JOB CONTEXT BAR — Interactions
    // ============================================================

    // Toggle job detail panel on context bar tap
    document.getElementById('jobContextBar').addEventListener('click', (e) => {
      if (e.target.id === 'jobClearBtn') return;
      const panel = document.getElementById('jobDetailPanel');
      panel.classList.toggle('visible');
    });

    // Clear job button
    document.getElementById('jobClearBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      clearJob();
      document.getElementById('jobDetailPanel').classList.remove('visible');
    });

    // Job detail panel fields → update job state
    ['jobModel', 'jobSerial', 'jobCustomer', 'jobInvoice'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        const fieldMap = {
          jobModel: 'modelNumber',
          jobSerial: 'serialNumber',
          jobCustomer: 'customerName',
          jobInvoice: 'invoiceNum'
        };
        setJobField(fieldMap[id], document.getElementById(id).value.trim());
      });
    });

    // ============================================================
    // BRAND DETECTION & SELECTION
    // ============================================================

    const modelInput = document.getElementById('modelInput');
    const brandChips = document.querySelectorAll('.brand-chip');

    // Auto-detect brand as user types
    modelInput.addEventListener('input', () => {
      const model = modelInput.value.trim().toUpperCase();
      if (model.length < 2) return;

      // Try to match a brand pattern
      for (const pattern of BRAND_PATTERNS) {
        if (pattern.prefix.test(model)) {
          selectBrand(pattern.brand);
          return;
        }
      }
    });

    // Manual brand selection via chips
    brandChips.forEach(chip => {
      chip.addEventListener('click', () => {
        selectBrand(chip.dataset.brand);
      });
    });

    function selectBrand(brand) {
      selectedBrand = brand;
      // Update chip visual state
      brandChips.forEach(c => {
        c.classList.toggle('selected', c.dataset.brand === brand);
      });
    }

    // ============================================================
    // SEARCH — Generate links to parts sites
    // ============================================================

    const searchBtn = document.getElementById('searchBtn');
    const resultsSection = document.getElementById('resultsSection');
    const resultLinks = document.getElementById('resultLinks');
    const openAllBtn = document.getElementById('openAllBtn');

    searchBtn.addEventListener('click', () => {
      const model = modelInput.value.trim();
      if (!model) {
        modelInput.focus();
        return;
      }

      // Build list of sites to show
      let sites = [...SITES.always];

      // Add brand-specific sites if a brand is selected
      if (selectedBrand && SITES[selectedBrand]) {
        sites = [...sites, ...SITES[selectedBrand]];
      }

      // Generate the links
      resultLinks.innerHTML = '';
      const urls = []; // for "Open All"

      sites.forEach(site => {
        const url = site.url.replace('{model}', encodeURIComponent(model));
        urls.push(url);

        const link = document.createElement('a');
        link.href = url;
        link.target = '_blank';
        link.rel = 'noopener';
        link.className = 'result-link';
        link.innerHTML = `
          <div>
            <div class="site-name">${site.name}</div>
            <div class="site-note">${site.note}</div>
          </div>
          <div class="arrow">&rsaquo;</div>
        `;
        resultLinks.appendChild(link);
      });

      resultsSection.classList.add('visible');

      // Also auto-fill the notes tab model field
      document.getElementById('noteModel').value = model;

      // Update job context with search results
      setJobField('modelNumber', model);
      if (selectedBrand) setJobField('brand', selectedBrand);

      // Save to search history
      saveToHistory(model, selectedBrand);

      // Copy model number to clipboard for easy pasting (e.g., into Marcone search)
      copyToClipboard(model);
    });

    // Open all links at once
    openAllBtn.addEventListener('click', () => {
      const links = resultLinks.querySelectorAll('a');
      links.forEach(link => {
        window.open(link.href, '_blank');
      });
    });

    // ============================================================
    // SEARCH HISTORY — Stored in localStorage
    // ============================================================

    function saveToHistory(model, brand) {
      const history = JSON.parse(localStorage.getItem('fb_history') || '[]');
      // Add to front, remove duplicates
      const filtered = history.filter(h => h.model !== model);
      filtered.unshift({
        model: model,
        brand: brand || 'unknown',
        date: new Date().toLocaleDateString()
      });
      // Keep last 50 entries
      localStorage.setItem('fb_history', JSON.stringify(filtered.slice(0, 50)));
      renderHistory();
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem('fb_history') || '[]');
      const list = document.getElementById('historyList');

      if (history.length === 0) {
        list.innerHTML = '<div class="empty-state">No searches yet</div>';
        return;
      }

      list.innerHTML = '';
      history.forEach(item => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `
          <div>
            <div class="history-model">${item.model}</div>
            <div class="history-brand">${item.brand}</div>
          </div>
          <div class="history-date">${item.date}</div>
        `;
        // Clicking a history item loads it into the lookup tab
        div.addEventListener('click', () => {
          modelInput.value = item.model;
          if (item.brand && item.brand !== 'unknown') {
            selectBrand(item.brand);
          }
          // Switch to lookup tab
          switchTab('lookup');
        });
        list.appendChild(div);
      });
    }

    document.getElementById('clearHistoryBtn').addEventListener('click', () => {

    // ============================================================

    // Add a bullet point row

    // Build the formatted note preview

    // ============================================================
    // CLIPBOARD — Async function that tries the modern Clipboard
    // API first (needs HTTPS, which GitHub Pages gives us), then
    // falls back to the old execCommand method for HTTP/older browsers.
    // ============================================================

    async function copyToClipboard(text) {
      // Method 1: Modern Clipboard API (works on HTTPS)
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(text);
          return true;
        } catch (e) {
          // Permission denied or other error — try fallback
          console.log('Clipboard API failed, trying fallback:', e);
        }
      }

      // Method 2: Old-school execCommand fallback (HTTP / older browsers)
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.style.fontSize = '16px';
      textarea.style.position = 'fixed';
      textarea.style.left = '0';
      textarea.style.top = '0';
      textarea.style.width = '1px';
      textarea.style.height = '1px';
      textarea.style.opacity = '0.01';
      textarea.setAttribute('readonly', '');

      document.body.appendChild(textarea);
      textarea.focus();
      textarea.select();
      textarea.setSelectionRange(0, text.length);

      let success = false;
      try {
        success = document.execCommand('copy');
      } catch (e) {
        success = false;
      }
      document.body.removeChild(textarea);
      return success;
    }

    // ============================================================
    // TOAST NOTIFICATION

    function showToast(message) {

    // ============================================================
    // OCR — Camera capture and text extraction
    // Uses Tesseract.js to read model/serial tags from photos.
    // Runs entirely in the browser — no server or API key needed.
    // ============================================================

    const cameraBtn = document.getElementById('cameraBtn');
    const cameraInput = document.getElementById('cameraInput');
    const ocrOverlay = document.getElementById('ocrOverlay');
    const ocrPreview = document.getElementById('ocrPreview');
    const ocrStatus = document.getElementById('ocrStatus');
    const ocrProgressBar = document.getElementById('ocrProgressBar');
    const ocrResults = document.getElementById('ocrResults');
    const ocrCloseBtn = document.getElementById('ocrCloseBtn');

    // Camera button opens the file picker (which triggers camera on mobile)
    cameraBtn.addEventListener('click', () => {
      cameraInput.click();
    });

    // ---- Image preprocessing: boost contrast + optional rotation ----
    // Appliance tags are often in bad lighting, at angles, or sideways.
    // Converting to high-contrast B&W helps Tesseract significantly.
    // rotationDeg: 0, 90, 180, or 270 — rotates the image before processing
    function preprocessImage(file, rotationDeg = 0) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          // ---- Downscale large images ----
          // iPhone photos are 4000+ px. Huge images are SLOWER and LESS
          // accurate for OCR — Tesseract works best around 1000-1500px.
          const MAX_DIM = 1500;
          let w = img.width;
          let h = img.height;
          if (Math.max(w, h) > MAX_DIM) {
            const scale = MAX_DIM / Math.max(w, h);
            w = Math.round(w * scale);
            h = Math.round(h * scale);
          }

          const canvas = document.createElement('canvas');

          // If rotating 90 or 270, swap width/height
          if (rotationDeg === 90 || rotationDeg === 270) {
            canvas.width = h;
            canvas.height = w;
          } else {
            canvas.width = w;
            canvas.height = h;
          }
          const ctx = canvas.getContext('2d');

          // Apply rotation around center, draw scaled image
          ctx.save();
          ctx.translate(canvas.width / 2, canvas.height / 2);
          ctx.rotate((rotationDeg * Math.PI) / 180);
          ctx.drawImage(img, -w / 2, -h / 2, w, h);
          ctx.restore();

          // Get pixel data and convert to high-contrast B&W
          const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const data = imageData.data;

          for (let i = 0; i < data.length; i += 4) {
            // Grayscale using luminance formula
            let gray = 0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2];
            // Contrast boost
            gray = ((gray / 255 - 0.5) * 1.5 + 0.5) * 255;
            gray = Math.max(0, Math.min(255, gray));
            // Threshold to pure B&W
            gray = gray > 128 ? 255 : 0;
            data[i] = gray;
            data[i+1] = gray;
            data[i+2] = gray;
          }

          ctx.putImageData(imageData, 0, 0);
          canvas.toBlob((blob) => {
            URL.revokeObjectURL(img.src);
            resolve(blob);
          }, 'image/png');
        };
        img.src = URL.createObjectURL(file);
      });
    }

    // ---- Run OCR on a preprocessed blob (helper) ----
    async function runOcrPass(blob, updateProgress) {
      const result = await Tesseract.recognize(blob, 'eng', {
        logger: (info) => {
          if (info.status === 'recognizing text' && updateProgress) {
            updateProgress(info.progress);
          }
        }
      });
      return result.data.text;
    }

    // ---- Score OCR results — higher = better text found ----
    // Used to compare 0° vs 90° rotation results
    function scoreOcrCandidates(candidates) {
      let score = 0;
      for (const c of candidates) {
        if (c.tag.includes('from label')) score += 10;  // labeled match = best
        else if (c.tag.includes('Likely model')) score += 5;
        else if (c.tag.includes('Likely serial')) score += 5;
        else if (c.tag.includes('Numeric code')) score += 2;
        else if (c.tag.includes('Short code')) score += 1;
      }
      return score;
    }

    // When a photo is captured/selected
    cameraInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // Show the overlay with preview of original image
      const imageUrl = URL.createObjectURL(file);
      ocrPreview.src = imageUrl;
      ocrOverlay.classList.add('visible');
      ocrStatus.textContent = 'Enhancing image...';
      ocrProgressBar.style.width = '0%';
      ocrResults.innerHTML = '';
      ocrCloseBtn.textContent = 'Cancel';

      try {
        // ---- Pass 1: Try the image at 0° (normal orientation) ----
        const blob0 = await preprocessImage(file, 0);
        ocrStatus.textContent = 'Reading tag...';

        const rawText0 = await runOcrPass(blob0, (progress) => {
          const pct = Math.round(progress * 50); // 0-50% for first pass
          ocrProgressBar.style.width = pct + '%';
          ocrStatus.textContent = `Reading... ${pct}%`;
        });

        let candidates = parseOcrText(rawText0);
        let score = scoreOcrCandidates(candidates);

        // ---- Pass 2: If 0° didn't find good results, try 90° rotation ----
        // Many appliance tags are mounted sideways (especially on sides/backs)
        if (score < 5) {
          ocrStatus.textContent = 'Trying rotated...';
          const blob90 = await preprocessImage(file, 90);

          const rawText90 = await runOcrPass(blob90, (progress) => {
            const pct = 50 + Math.round(progress * 25); // 50-75%
            ocrProgressBar.style.width = pct + '%';
            ocrStatus.textContent = `Trying rotated... ${pct}%`;
          });

          const candidates90 = parseOcrText(rawText90);
          const score90 = scoreOcrCandidates(candidates90);

          // ---- Pass 3: Also try 270° (rotated the other way) ----
          const blob270 = await preprocessImage(file, 270);

          const rawText270 = await runOcrPass(blob270, (progress) => {
            const pct = 75 + Math.round(progress * 25); // 75-100%
            ocrProgressBar.style.width = pct + '%';
            ocrStatus.textContent = `Trying rotated... ${pct}%`;
          });

          const candidates270 = parseOcrText(rawText270);
          const score270 = scoreOcrCandidates(candidates270);

          // Pick the best rotation
          if (score90 > score && score90 >= score270) {
            candidates = candidates90;
            score = score90;
          } else if (score270 > score) {
            candidates = candidates270;
            score = score270;
          }
        }

        ocrProgressBar.style.width = '100%';

        // ---- Show results ----
        if (candidates.length === 0) {
          ocrStatus.textContent = 'Could not find model/serial numbers';
          ocrResults.innerHTML = '<div class="empty-state">' +
            'Tips for better results:<br><br>' +
            '- Hold phone straight, parallel to the tag<br>' +
            '- Tag should fill most of the frame<br>' +
            '- Good lighting, avoid shadows<br>' +
            '- Wipe dust/grease off the tag' +
            '</div>';
        } else {
          ocrStatus.textContent = 'Select model or serial number:';
          ocrResults.innerHTML = '';
          candidates.forEach(item => {
            const div = document.createElement('div');
            div.className = 'ocr-result-item';
            div.innerHTML = `${item.text}<span class="ocr-tag">${item.tag}</span>`;

            div.addEventListener('click', () => {
              if (item.tag.includes('serial') || item.tag.includes('Serial')) {
                document.getElementById('noteSerial').value = item.text;
                setJobField('serialNumber', item.text);
                showToast('Serial filled in Notes tab');
              } else {
                modelInput.value = item.text;
                modelInput.dispatchEvent(new Event('input'));
                document.getElementById('noteModel').value = item.text;
                setJobField('modelNumber', item.text);
                showToast('Model number set: ' + item.text);
              }
              ocrOverlay.classList.remove('visible');
              cameraInput.value = '';
            });

            ocrResults.appendChild(div);
          });
        }
        ocrCloseBtn.textContent = 'Close';

      } catch (err) {
        ocrStatus.textContent = 'OCR failed — try again';
        ocrCloseBtn.textContent = 'Close';
        console.error('OCR error:', err);
      }

      URL.revokeObjectURL(imageUrl);
    });

    // Close the OCR overlay
    ocrCloseBtn.addEventListener('click', () => {
      ocrOverlay.classList.remove('visible');
      cameraInput.value = '';
    });

    // ============================================================
    // OCR TEXT PARSING
    // Extracts likely model and serial numbers from raw OCR text.
    // Model numbers: typically 8-15 chars, mix of letters and numbers
    // Serial numbers: typically longer, more numeric
    // ============================================================

    function parseOcrText(rawText) {
      const candidates = [];
      const seen = new Set();

      // ---- STEP 1: Look for labeled values ----
      // High-confidence matches — the value right after a label keyword.
      // Covers many formats: MOD., Model:, M/N, Service no., ART. NO., SERIAL NO., etc.
      const labelPatterns = [
        // Model labels: MODEL NUMBER, MODEL NO., MODEL NO:, MODEL#, MODEL:, MOD., M/N
        // The (?:NUMBER|NO\.?|#) group is key — without it, "MODEL NUMBER" would
        // capture "NUMBER" as the value instead of the actual model number after it
        { regex: /(?:MOD(?:EL)?\.?\s*(?:NUMBER|NO\.?|#)?\s*[:.]?\s*|M\/N\s*[:.]?\s*)([A-Za-z0-9][\w\-\.]{3,})/gi, type: 'model' },
        // Serial labels: SERIAL NUMBER, SERIAL NO., SER., S/N
        { regex: /(?:SER(?:IAL)?\.?\s*(?:NUMBER|NO\.?|#)?\s*[:.]?\s*|S\/N\s*[:.]?\s*)([A-Za-z0-9][\w\-\.]{3,})/gi, type: 'serial' },
        // Stock number (Whirlpool uses this)
        { regex: /(?:STOCK\s*(?:NUMBER|NO\.?|#)?\s*[:.]?\s*)([A-Za-z0-9][\w\-\.]{3,})/gi, type: 'model' },
        // Service no. / Service number (Miele, Bosch, European brands)
        { regex: /(?:SERVICE\s*(?:NO\.?|NUMBER|#)\s*[:.]?\s*)([A-Za-z0-9][\w\-\.]{3,})/gi, type: 'model' },
        // ART. NO. / Article Number / Art. Nr. (European brands)
        { regex: /(?:ART(?:ICLE)?\.?\s*(?:NO\.?|NR\.?|NUMBER|#)\s*[:.]?\s*)([A-Za-z0-9][\w\-\.\/]{3,})/gi, type: 'part' },
        // P/N, Part No., Part Number
        { regex: /(?:P\/N\s*[:.]?\s*|PART\s*(?:NO\.?|NUMBER|#)\s*[:.]?\s*)([A-Za-z0-9][\w\-\.]{3,})/gi, type: 'part' },
        // TYPE / Type: (some brands label model as "Type")
        { regex: /(?:TYPE\.?\s*[:.]?\s*)([A-Za-z0-9][\w\-\.]{3,})/gi, type: 'model' },
      ];

      labelPatterns.forEach(({ regex, type }) => {
        let match;
        while ((match = regex.exec(rawText)) !== null) {
          const value = match[1].replace(/[^A-Za-z0-9\-]/g, '').toUpperCase();
          if (value.length >= 4 && !seen.has(value)) {
            seen.add(value);
            const tagName = type === 'serial' ? 'Serial (from label)'
              : type === 'part' ? 'Part number (from label)'
              : 'Model (from label)';
            candidates.push({ text: value, tag: tagName });
          }
        }
      });

      // ---- STEP 2: Find other alphanumeric codes that look like model/serial ----
      const cleanedText = rawText.replace(/[|\\\/\[\]{}()]/g, ' ');
      const tokens = cleanedText
        .split(/[\s,;:]+/)
        .map(t => t.trim().replace(/^[.\-_]+|[.\-_]+$/g, ''))
        .filter(t => t.length >= 3);

      // Words to skip — common label text on appliance tags
      const skipWords = new Set(['MODEL', 'SERIAL', 'NUMBER', 'STOCK', 'TYPE',
        'STYLE', 'COLOR', 'SIZE', 'BRAND', 'MOTOR', 'HEATER', 'TOTAL',
        'MADE', 'USA', 'CHINA', 'MEXICO', 'KOREA', 'DATE', 'MFG', 'PROD',
        'RATING', 'VOLTS', 'AMPS', 'WATTS', 'HERTZ', 'PHASE', 'CYCLE',
        'THIS', 'THE', 'FOR', 'WITH', 'FROM', 'LISTED', 'MANUFACTURED',
        'PATENT', 'WARNING', 'CAUTION', 'DANGER', 'IMPORTANT', 'NOTE',
        'SEE', 'USE', 'ONLY', 'NOT', 'AND', 'MAX', 'MIN', 'REF', 'CAT',
        'UNIT', 'MOD', 'SER', 'CORP', 'CORPORATION', 'INC', 'WHIRLPOOL',
        'SAMSUNG', 'FRIGIDAIRE', 'ELECTROLUX', 'BOSCH', 'THERMADOR',
        'MAYTAG', 'KITCHENAID', 'AMANA', 'VIKING', 'MIELE', 'TEST',
        'PRESSURES', 'BENTON', 'HARBOR', 'MICHIGAN', 'SERVICE',
        'MARCA', 'REGISTRADA', 'ARTICLE']);

      tokens.forEach(token => {
        const cleaned = token.replace(/[^A-Za-z0-9\-]/g, '');
        if (cleaned.length < 3) return;

        const upper = cleaned.toUpperCase();
        if (seen.has(upper)) return;
        if (skipWords.has(upper)) return;

        seen.add(upper);

        const hasLetter = /[A-Za-z]/.test(cleaned);
        const hasNumber = /[0-9]/.test(cleaned);
        const digitRatio = (upper.match(/[0-9]/g) || []).length / upper.length;

        let tag;
        if (hasLetter && hasNumber && upper.length >= 6) {
          tag = (upper.length > 14 || digitRatio > 0.7) ? 'Likely serial' : 'Likely model';
        } else if (hasNumber && !hasLetter && upper.length >= 6) {
          tag = 'Numeric code';
        } else if (hasLetter && hasNumber) {
          tag = 'Short code';
        } else {
          return;
        }

        candidates.push({ text: upper, tag: tag });
      });

      // Sort: labeled matches first, then likely model, serial, then others
      const priority = {
        'Model (from label)': 0,
        'Serial (from label)': 1,
        'Part number (from label)': 2,
        'Likely model': 3,
        'Likely serial': 4,
        'Short code': 5,
        'Numeric code': 6
      };
      candidates.sort((a, b) => (priority[a.tag] || 9) - (priority[b.tag] || 9));

      return candidates;
    }

    // ============================================================
    // PARTS TAB — Send part orders to Google Sheets
    // ============================================================

    // Google Apps Script Web App URL — set this after deploying the script
    // (see instructions in the repo README or braindump notes)
    let SHEETS_SCRIPT_URL = localStorage.getItem('fb_sheets_url') || '';

    let partStatus = 'aa'; // 'aa' or 'date'

    // Status toggle (AA vs Approved Date)
    document.querySelectorAll('[data-status]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-status]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        partStatus = btn.dataset.status;
        // Show/hide date picker
        document.getElementById('partDateRow').style.display =
          partStatus === 'date' ? 'block' : 'none';
        updatePartPreview();
      });
    });

    // Set default date to today
    document.getElementById('partDate').valueAsDate = new Date();

    // Sync parts fields back to job context
    document.getElementById('partCustomer').addEventListener('input', () => {
      setJobField('customerName', document.getElementById('partCustomer').value.trim());
    });
    document.getElementById('partInvoice').addEventListener('input', () => {
      setJobField('invoiceNum', document.getElementById('partInvoice').value.trim());
    });

    // Update preview as fields change
    ['partNumber', 'partDesc'].forEach(id => {
      document.getElementById(id).addEventListener('input', updatePartPreview);
    });
    document.getElementById('partDate').addEventListener('change', updatePartPreview);

    // Build the Column C preview: ***P# [number]*** **[description]**
    function updatePartPreview() {
      const num = document.getElementById('partNumber').value || '(part #)';
      const desc = document.getElementById('partDesc').value || '(description)';
      document.getElementById('partPreview').textContent =
        `***P# ${num}*** **${desc}**`;
    }
    updatePartPreview();

    // Get the status value — "Aa" for awaiting approval, or "MM/DD" for approved
    function getPartStatusValue() {
      if (partStatus === 'aa') return 'Aa';
      const dateVal = document.getElementById('partDate').value;
      if (!dateVal) return 'Aa';
      // dateVal is YYYY-MM-DD from the date input — reformat to MM/DD for readability in the sheet
      const [year, month, day] = dateVal.split('-');
      return `${month}/${day}`;
    }

    // Core send function — extracted so both buttons can use it.
    // Returns true on success, false on failure or validation error.
    async function sendPart() {
      const customer = document.getElementById('partCustomer').value.trim();
      const invoice = document.getElementById('partInvoice').value.trim();
      const partNum = document.getElementById('partNumber').value.trim();
      const partDesc = document.getElementById('partDesc').value.trim();
      const status = getPartStatusValue();

      if (!customer || !partNum) {
        showToast('Need at least customer name and part #');
        return false;
      }

      // Format Column C: ***P# [number]*** **[description]**
      const colC = partDesc
        ? `***P# ${partNum}*** **${partDesc}**`
        : `***P# ${partNum}***`;

      const highlight = document.getElementById('partWarranty').checked;

      // Check if Google Sheets URL is configured — prompt once and save
      if (!SHEETS_SCRIPT_URL) {
        const url = prompt(
          'Paste your Google Apps Script Web App URL.\n\n' +
          '(You only need to do this once — it will be saved.)\n\n' +
          'See setup instructions in the Parts tab.'
        );
        if (!url) return false;
        SHEETS_SCRIPT_URL = url.trim();
        localStorage.setItem('fb_sheets_url', SHEETS_SCRIPT_URL);
      }

      try {
        // JSONP: inject a <script> tag that calls our callback with the real response.
        // Unlike fetch(), this avoids CORS issues with the Google Apps Script redirect.
        const params = new URLSearchParams({
          customer: customer,
          invoice: invoice,
          partInfo: colC,
          status: status,
          highlight: highlight ? 'true' : 'false'
        });
        const fullUrl = SHEETS_SCRIPT_URL + '?' + params.toString();

        await new Promise((resolve, reject) => {
          const cbName = '_sheetCb_' + Date.now();
          const script = document.createElement('script');

          const cleanup = () => {
            delete window[cbName];
            if (script.parentNode) script.parentNode.removeChild(script);
          };

          window[cbName] = (data) => {
            cleanup();
            if (data && data.status === 'ok') {
              // Debug: log where data went (remove after confirming fix)
              if (data.sheetName) {
                console.log('Sheet debug:', data);
                alert('Wrote to row ' + data.row + ' in "' + data.tabName + '" tab of "' + data.sheetName + '"\n\n' + data.sheetUrl);
              }
              resolve();
            } else {
              reject(new Error(data && data.message ? data.message : 'Unknown error from Google Sheets'));
            }
          };

          script.onerror = () => {
            cleanup();
            reject(new Error('Could not reach Google Sheets'));
          };

          script.src = fullUrl + '&callback=' + cbName;
          document.body.appendChild(script);

          // Timeout after 15 seconds
          setTimeout(() => {
            if (window[cbName]) {
              cleanup();
              reject(new Error('Google Sheets request timed out'));
            }
          }, 15000);
        });

        showToast(highlight ? 'Sent (warranty — yellow)!' : 'Sent to Google Sheet!');
        saveToPartsLog(customer, invoice, colC, status, highlight);
        return true;

      } catch (err) {
        showToast('Failed: ' + err.message);
        console.error('Sheet send error:', err);
        return false;
      }
    }

    // ============================================================
    // QUICK SEND MODE — Collapse form after first part sent
    // ============================================================

    let quickSendActive = false;

    function activateQuickSend() {
      quickSendActive = true;
      const strip = document.getElementById('partsContextStrip');
      const form = document.getElementById('partsFullForm');

      // Update strip with current values
      document.getElementById('stripCustomer').textContent =
        document.getElementById('partCustomer').value || '—';
      document.getElementById('stripInvoice').textContent =
        document.getElementById('partInvoice').value || '—';
      document.getElementById('stripStatus').textContent = getPartStatusValue();

      strip.classList.add('visible');
      form.classList.add('collapsed');
    }

    // Toggle Quick Send form expansion
    document.getElementById('partsContextStrip').addEventListener('click', () => {
      const form = document.getElementById('partsFullForm');
      form.classList.toggle('collapsed');
    });

    // Send to Google Sheet — sends current part, then clears part # and desc
    document.getElementById('sendToSheetBtn').addEventListener('click', async () => {
      const sendBtn = document.getElementById('sendToSheetBtn');
      sendBtn.textContent = 'Sending...';
      sendBtn.disabled = true;

      const success = await sendPart();

      if (success) {
        // Clear part fields (keep customer & invoice for multi-part orders)
        document.getElementById('partNumber').value = '';
        document.getElementById('partDesc').value = '';
        updatePartPreview();
        if (!quickSendActive) {
          activateQuickSend();
        }
      }

      sendBtn.textContent = 'Send to Google Sheet';
      sendBtn.disabled = false;
    });

    // "Add Another Part" — sends the current part first, THEN clears the part fields.
    // Bug fix: old version only cleared fields without sending, so parts were lost.
    document.getElementById('addAnotherPartBtn').addEventListener('click', async () => {
      const addBtn = document.getElementById('addAnotherPartBtn');
      addBtn.textContent = 'Sending...';
      addBtn.disabled = true;

      const success = await sendPart();

      addBtn.textContent = '+ Add Another Part (Same Customer)';
      addBtn.disabled = false;

      if (success) {
        // Clear just the part fields — customer and invoice stay filled in
        document.getElementById('partNumber').value = '';
        document.getElementById('partDesc').value = '';
        updatePartPreview();
        document.getElementById('partNumber').focus();
        if (!quickSendActive) {
          activateQuickSend();
        }
      }
    });

    // Clear all parts fields
    document.getElementById('clearPartsBtn').addEventListener('click', () => {
      document.getElementById('partCustomer').value = '';
      document.getElementById('partInvoice').value = '';
      document.getElementById('partNumber').value = '';
      document.getElementById('partDesc').value = '';
      partStatus = 'aa';
      document.querySelectorAll('[data-status]').forEach(b => {
        b.classList.toggle('active', b.dataset.status === 'aa');
      });
      document.getElementById('partDateRow').style.display = 'none';
      document.getElementById('partWarranty').checked = false;
      updatePartPreview();
      // Reset Quick Send mode
      quickSendActive = false;
      document.getElementById('partsContextStrip').classList.remove('visible');
      document.getElementById('partsFullForm').classList.remove('collapsed');
    });

    // Reset Sheet URL — in case the saved URL is wrong
    document.getElementById('resetSheetUrlBtn').addEventListener('click', () => {
      const current = SHEETS_SCRIPT_URL || '(not set)';
      const url = prompt(
        'Current URL:\n' + current + '\n\nPaste new Google Apps Script Web App URL:'
      );
      if (url) {
        SHEETS_SCRIPT_URL = url.trim();
        localStorage.setItem('fb_sheets_url', SHEETS_SCRIPT_URL);
        showToast('Sheet URL updated');
      }
    });

    // Test Sheet Connection — sends a no-data JSONP ping to verify the URL works
    document.getElementById('testSheetBtn').addEventListener('click', () => {
      if (!SHEETS_SCRIPT_URL) {
        showToast('No Sheet URL set — click "Change Sheet URL" first');
        return;
      }
      const testBtn = document.getElementById('testSheetBtn');
      testBtn.textContent = 'Testing...';
      testBtn.disabled = true;

      const cbName = '_sheetTest_' + Date.now();
      const script = document.createElement('script');
      const cleanup = () => {
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
        testBtn.textContent = 'Test Sheet Connection';
        testBtn.disabled = false;
      };

      window[cbName] = (data) => {
        cleanup();
        if (data && data.status === 'ok') {
          showToast('Connection OK!');
        } else {
          showToast('Error: ' + (data && data.message ? data.message : 'Unknown'));
        }
      };

      script.onerror = () => {
        cleanup();
        showToast('Failed — could not reach Google Sheets');
      };

      // Call with just the callback param (no customer = status check only)
      script.src = SHEETS_SCRIPT_URL + '?callback=' + cbName;
      document.body.appendChild(script);

      setTimeout(() => {
        if (window[cbName]) {
          cleanup();
          showToast('Timed out — check URL and try again');
        }
      }, 15000);
    });

    // Parts log — saved locally for reference
    function saveToPartsLog(customer, invoice, partInfo, status, highlight) {
      const log = JSON.parse(localStorage.getItem('fb_parts_log') || '[]');
      log.unshift({
        customer, invoice, partInfo, status, highlight,
        date: new Date().toLocaleString()
      });
      localStorage.setItem('fb_parts_log', JSON.stringify(log.slice(0, 200)));
      renderPartsLog();
    }

    function renderPartsLog() {
      const log = JSON.parse(localStorage.getItem('fb_parts_log') || '[]');
      const list = document.getElementById('partsLog');

      if (log.length === 0) {
        list.innerHTML = '<div class="empty-state">No parts sent yet</div>';
        return;
      }

      list.innerHTML = '';
      log.forEach(item => {
        const div = document.createElement('div');
        div.className = 'saved-note-item';
        div.innerHTML = `
          <div class="saved-note-title">${item.highlight ? '🟡 ' : ''}${item.customer}</div>
          <div class="saved-note-meta">
            Inv: ${item.invoice || '—'} | ${item.partInfo} | ${item.status} | ${item.date}
          </div>
        `;
        list.appendChild(div);
      });
    }

    // ============================================================
    // STOCK TAB — Truck inventory viewer
    // ============================================================

    // URL for the Truck Stock Apps Script web app (stored once in localStorage)
    let STOCK_SCRIPT_URL = localStorage.getItem('fb_truck_stock_url') || '';

    // All inventory items currently loaded (used for search filtering)
    let stockItems = [];

    // Render the inventory table from the in-memory stockItems array.
    // If a filter string is given, only rows matching part # or description are shown.
    function renderStockTable(filter) {
      const tbody = document.getElementById('stockTableBody');
      const emptyState = document.getElementById('stockEmptyState');
      tbody.innerHTML = '';

      const term = (filter || '').trim().toLowerCase();
      const visible = term
        ? stockItems.filter(item =>
            item.partNum.toLowerCase().includes(term) ||
            item.desc.toLowerCase().includes(term))
        : stockItems;

      if (visible.length === 0) {
        emptyState.style.display = 'block';
        emptyState.textContent = term ? 'No parts match that search' : 'No stock data — tap Refresh to load';
        return;
      }
      emptyState.style.display = 'none';

      visible.forEach(item => {
        const tr = document.createElement('tr');
        const remaining = Number(item.remaining);
        const minStock = Number(item.minStock);

        // Color coding: red = out of stock, yellow = at or below min stock threshold
        if (remaining === 0) {
          tr.className = 'stock-row-out';
        } else if (!isNaN(minStock) && minStock > 0 && remaining <= minStock) {
          tr.className = 'stock-row-low';
        }

        tr.innerHTML = `
          <td>${item.partNum}</td>
          <td>${item.desc}</td>
          <td>${remaining}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Fetch fresh inventory from the Apps Script web app via JSONP.
    // Same pattern as the Parts tab — avoids CORS issues.
    async function fetchStockData() {
      if (!STOCK_SCRIPT_URL) {
        const url = prompt(
          'Paste your Truck Stock Apps Script Web App URL.\n\n' +
          '(You only need to do this once — it will be saved.)'
        );
        if (!url) return;
        STOCK_SCRIPT_URL = url.trim();
        localStorage.setItem('fb_truck_stock_url', STOCK_SCRIPT_URL);
      }

      const refreshBtn = document.getElementById('stockRefreshBtn');
      refreshBtn.textContent = 'Loading...';
      refreshBtn.disabled = true;

      try {
        const data = await new Promise((resolve, reject) => {
          const cbName = '_stockCb_' + Date.now();
          const script = document.createElement('script');

          const cleanup = () => {
            delete window[cbName];
            if (script.parentNode) script.parentNode.removeChild(script);
          };

          window[cbName] = (data) => {
            cleanup();
            if (data && data.status === 'ok') {
              resolve(data);
            } else {
              reject(new Error(data && data.message ? data.message : 'Unknown error'));
            }
          };

          script.onerror = () => {
            cleanup();
            reject(new Error('Could not reach Stock Sheet'));
          };

          script.src = STOCK_SCRIPT_URL + '?callback=' + cbName;
          document.body.appendChild(script);

          setTimeout(() => {
            if (window[cbName]) {
              cleanup();
              reject(new Error('Stock request timed out'));
            }
          }, 15000);
        });

        // Save to localStorage for offline use
        stockItems = data.items || [];
        const lastUpdated = new Date().toLocaleString('en-US', {
          month: 'numeric', day: 'numeric',
          hour: 'numeric', minute: '2-digit'
        });
        localStorage.setItem('fb_truck_stock', JSON.stringify({ items: stockItems, lastUpdated }));
        document.getElementById('stockLastUpdated').textContent = 'Last updated: ' + lastUpdated;

        renderStockTable(document.getElementById('stockSearch').value);
        showToast('Stock loaded!');

      } catch (err) {
        showToast('Failed: ' + err.message);
        console.error('Stock fetch error:', err);
      }

      refreshBtn.textContent = 'Refresh';
      refreshBtn.disabled = false;
    }

    // Load cached data from localStorage on startup (works offline)
    function loadCachedStock() {
      const cached = localStorage.getItem('fb_truck_stock');
      if (!cached) return;
      try {
        const { items, lastUpdated } = JSON.parse(cached);
        stockItems = items || [];
        document.getElementById('stockLastUpdated').textContent =
          'Last updated: ' + (lastUpdated || 'unknown');
        renderStockTable();
      } catch (e) {
        // Corrupted cache — ignore and let user refresh
      }
    }

    // Search bar — filters table in real time as user types
    document.getElementById('stockSearch').addEventListener('input', (e) => {
      renderStockTable(e.target.value);
    });

    // Refresh button — fetches fresh data from the sheet
    document.getElementById('stockRefreshBtn').addEventListener('click', fetchStockData);

    // Change Stock URL — in case the saved URL needs updating
    document.getElementById('resetStockUrlBtn').addEventListener('click', () => {
      const current = STOCK_SCRIPT_URL || '(not set)';
      const url = prompt('Current URL:\n' + current + '\n\nPaste new Stock Apps Script URL:');
      if (url) {
        STOCK_SCRIPT_URL = url.trim();
        localStorage.setItem('fb_truck_stock_url', STOCK_SCRIPT_URL);
        showToast('Stock URL updated');
      }
    });

    // ============================================================
    // INITIALIZATION
    // ============================================================

    // Render history, saved notes, and parts log on load
    renderHistory();
    renderSavedNotes();
    renderPartsLog();
    loadCachedStock(); // Load any cached truck stock data
    loadJob(); // Restore persisted job context

    // Register service worker for offline support
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log('Service worker registered'))
        .catch((err) => console.log('SW registration failed:', err));
    }
  </script>
